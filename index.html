async function boot() {
  const m = /[#&]act=([^&]+)/.exec(location.hash); if (m) { PendingActivation = decodeURIComponent(m[1]); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } }
  const lk = /[#&]link=([A-Za-z0-9-]{12,20})/.exec(location.hash); if (lk) { PendingLink = lk[1]; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } }
  desktopCls();
  if (!window.crypto || !crypto.subtle) {
    document.body.innerHTML = '<div class="onb center"><h2>تعذّر التشغيل</h2><p class="sub">يجب فتح التطبيق عبر رابط آمن (https) أو من التطبيق المثبّت.</p></div>';
    return;
  }
  await Store.open();
  await I18N.init();
  await License.init();
  await Me.init(); await Printers.init(); await AutoBk.init(); await Sync.init(); Remind.initNotif();
  await Plan.init();
  await Cloud.init();
  await Billing.init(); Plan.compute();
  await Vault.load();
  setupBackTrap(); Lock.init();
  if (Store.mode === 'mem') toast('تنبيه: المتصفح لا يسمح بحفظ البيانات في هذا الوضع', 5000);
  if (!Vault.ready()) { Nav.stack = [{ name: 'welcome', params: {} }]; if (PendingLink) { Nav.stack.push({ name: 'join', params: { code: PendingLink } }); PendingLink = null; } render(); }
  else {
    const raw = Vault.auto() ? await Vault.tryAuto() : null;
    if (raw) { await Vault.unlockWith(raw); await afterUnlock(); creditsSplash(); }
    else { Lock.on = true; showLockScreen(); }
  }
  try {
    if ('serviceWorker' in navigator && location.protocol === 'https:' && !isNative() && window.top === window && document.querySelector('link[rel=manifest]')) navigator.serviceWorker.register('sw.js').catch(() => { });
  } catch (e) { }
  const sp = document.getElementById('splash'); if (sp) sp.remove();
  setTimeout(() => Cloud.sync(true), 1500);
}

/* إعداد جهاز جديد في متجر قائم: رمز سري محلي ثم تنزيل البيانات */
async function joinStore(o) {
  const pin = await Modal.open('<div class="pinbox"></div>', { title: 'رمز سري لهذا الجهاز', dismissable: false, onMount(el) { newPinFlow($('.pinbox', el), async p => { Modal.close(p); }); } });
  if (!pin) return;
  const db = newDB(); setDB(db);
  await Store.del('imgs'); Imgs.reset(); await Store.del('autoKey');
  await Vault.create(pin, o.rec || null, db, o.raw);
  let label = {}; if (o.label) label = await decLabel(o.label);
  Sync.st = { store: o.store, dev: o.dev, sec: o.sec, role: o.role, kind: o.kind, primary: !!o.primary, prefix: label.prefix || (o.primary ? '' : 'A'), name: label.name || '', since: 0, created: Date.now() };
  if (label.name && !Me.name) await Me.set(label.name);
  Sync.hashes = {}; Sync.dirtyAt = {};
  await Sync.persistState(true);
  const prog = document.createElement('div'); prog.className = 'sync-prog'; prog.innerHTML = `<div>${ic('sync')}</div><b>جاري تنزيل بيانات المتجر…</b><div class="small" id="spN"></div>`;
  document.body.appendChild(prog);
  try { await Sync.pull(); await persist(); }
  catch (e) { console.warn(e); toast('تعذّر تنزيل البيانات الآن، ستُكمل المزامنة تلقائياً'); }
  finally { prog.remove(); }
  if (o.primary) { await adoptDevice(Sync.plan || {}); if (o.rec) Sync.setRecovery(o.rec).catch(() => { }); }
  Cloud.ev('join', { r: o.role[0], k: o.kind[0], p: o.primary ? 1 : 0 });
  Nav.stack = [{ name: 'home', params: {} }];
  await afterUnlock(true);
  toast(o.primary ? 'تمت الاستعادة من السحابة ✓' : 'تم ربط هذا الجهاز بالمتجر ✓', 3500);
  if (isDesktop() && !Vault.auto()) setTimeout(() => toast('يمكنك فتح التطبيق بدون رمز من «المزيد»', 3500), 3800);
}

async function recSetupFlow() {
  const r = await Modal.open(`<p class="muted" style="margin-top:0">لتستعيد بياناتك من السحابة إذا فقدت جوالك أو حذفت التطبيق، نربطها برمز الاستعادة (16 حرفاً) الذي حصلت عليه عند إنشاء التطبيق.</p>

    title: 'الاستعادة من السحابة', onMount(el) { el.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) Modal.close(b.dataset.r); }); }
  });
  if (!r) return;
  let code;
  if (r === 'have') {
    code = await Modal.open(`<div class="field"><input id="rsIn" class="num" style="text-align:center;font-size:20px" placeholder="XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off"></div><div id="rsMsg" class="pin-msg" style="color:var(--danger)"></div><button class="btn" id="rsGo">تحقق</button>`, {

    });

    if (!(await askPin())) return;

  }

  try { await Sync.setRecovery(code); toast('تم تفعيل الاستعادة من السحابة ✓'); } catch (e) { toast('تعذّر الاتصال، حاول لاحقاً'); }
  if (Nav.cur().name === 'cloud') render();

async function pairFlow(kind) {
  const L = CLOUD_LIMITS[Plan.id] || { pc: 0, users: 0 };
  let devs = []; try { devs = (await Sync.devices()).filter(d => !d.revoked); } catch (e) { return alertDlg('يلزم الاتصال بالإنترنت.'); }
  const pcs = devs.filter(d => d.kind === 'computer').length, users = devs.filter(d => d.role !== 'owner').length;
  if (kind === 'computer' && pcs >= L.pc) return alertDlg(`وصلت للحد المسموح في باقتك (${L.pc} ${L.pc === 1 ? 'كمبيوتر' : 'أجهزة كمبيوتر'}). افصل جهازاً أولاً${Plan.id === 'basic' ? ' أو رقِّ للباقة المتقدمة' : ''}.`);
  if (kind === 'phone' && users >= L.users) return alertDlg(`وصلت للحد المسموح في باقتك (${L.users} مستخدمين).`);
  let role = 'owner', name = 'كمبيوتر المحل';
  if (kind === 'phone') {
    name = await textSheet('اسم الموظف', '', 'مثال: أحمد'); if (!name) return;
    role = await roleSheet('seller'); if (!role) return;
  }
  let pr; try { pr = await Sync.newPairing(role, kind, name); } catch (e) { return alertDlg(/too_many/.test(e.message) ? 'وصلت للحد الأقصى من الأجهزة.' : 'تعذّر الاتصال بالخادم، حاول مرة أخرى.'); }
  const shareTxt = kind === 'computer' ? `افتح هذا الرابط على الكمبيوتر لربطه بمحلي في تطبيق فواتيري:\n${pr.link}` : `مرحباً ${name}، افتح هذا الرابط لتنضم إلى محل ${DB.settings.bizName} في تطبيق فواتيري:\n${pr.link}\nأو ثبّت التطبيق واختر «الانضمام إلى متجر» واكتب الرمز: ${groupCode(pr.code)}`;
  const t0 = Date.now(); let tick;
  await Modal.open(`<div class="center"><p class="muted" style="margin-top:0">${kind === 'computer' ? `على الكمبيوتر افتح:<br><b class="ltr" style="font-size:14px">${APP_URL.replace('https://', '')}</b><br>واختر «ربط هذا الكمبيوتر» واكتب الرمز:` : `أرسل الرابط إلى ${esc(name)}، أو ليمسح الرمز بكاميرا جواله:`}</p>
    <div class="code-box ltr" style="font-size:26px">${groupCode(pr.code)}</div>
    <div class="qr-box">${qrSvg(pr.link, 200)}</div>
    <div class="small muted" id="prT">صالح لمدة 15 دقيقة ولمرة واحدة</div></div>
    <div class="two" style="margin-top:10px"><button class="btn wa" id="prWa">${ic('wa')} إرسال بواتساب</button><button class="btn sec" id="prCp">${ic('copy')} نسخ الرابط</button></div>
    <div class="banner info" style="margin:10px 0 0">${ic('shield')}<div class="grow small">من يملك هذا الرمز يستطيع فتح بياناتك خلال 15 دقيقة. لا تشاركه إلا مع الشخص المقصود.</div></div>`, {
    title: kind === 'computer' ? 'ربط كمبيوتر' : 'إضافة ' + name, onMount(el) {
      $('#prWa', el).onclick = () => openExternal('https://wa.me/?text=' + encodeURIComponent(shareTxt));
      $('#prCp', el).onclick = async () => { try { await navigator.clipboard.writeText(kind === 'computer' ? pr.link : shareTxt); toast('تم النسخ ✓'); } catch (e) { toast('انسخ الرمز يدوياً'); } };
      Lock.grace(16 * 60000);
      const n0 = devs.length;
      tick = setInterval(async () => {
        const left = 15 * 60 - Math.round((Date.now() - t0) / 1000), t = $('#prT', el);
        if (left <= 0) { clearInterval(tick); if (t) t.textContent = 'انتهت صلاحية الرمز'; return; }
        if (t && left % 5 === 0) t.textContent = `صالح لمدة ${Math.ceil(left / 60)} دقيقة ولمرة واحدة`;
        if (left % 6 === 0) { try { const d = (await Sync.devices()).filter(x => !x.revoked); if (d.length > n0) { clearInterval(tick); Modal.close(true); toast('تم الربط بنجاح ✓', 3500); } } catch (e) { } }
      }, 1000);
    }, onClose() { clearInterval(tick); }
  });
  if (Nav.cur().name === 'cloud') render();
}
