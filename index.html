:root{
  --bg:#F3F5F7; --card:#fff; --text:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --pri:#0F766E; --pri-d:#115E59; --pri-l:#E6F4F1;
  --sale:#0E9F6E; --sale-l:#E7F7F0; --pur:#2563EB; --pur-l:#EAF1FE;
  --danger:#DC2626; --danger-l:#FDECEC; --warn:#D97706; --warn-l:#FEF4E6;
  --r:16px; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:Tajawal,"Segoe UI",Tahoma,system-ui,sans-serif;font-size:17px;line-height:1.5;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;outline:none;min-height:50px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--pri)}
.num{direction:ltr;text-align:end;font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)} .small{font-size:14px} .b{font-weight:700} .center{text-align:center}
.hide{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- layout ---------- */
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(10px + var(--safe-t)) 12px 10px;display:flex;align-items:center;gap:8px;min-height:60px}
#topbar h1{font-size:20px;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{background:rgba(255,255,255,.14);border:0;color:#fff;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.tb-btn:active{background:rgba(255,255,255,.28)}
#view{flex:1;padding:14px 14px calc(96px + var(--safe-b))}
#view.no-tabs{padding-bottom:calc(120px + var(--safe-b))}
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b)}
#tabbar .wrap{display:flex;width:100%;max-width:640px}
#tabbar button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);cursor:pointer}
#tabbar button.on{color:var(--pri);font-weight:700}
#tabbar button.on svg{stroke-width:2.4}

/* ---------- cards & lists ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:17px}
.sec-title{font-size:15px;color:var(--muted);margin:18px 4px 8px;font-weight:700}
.list{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-height:64px;background:#fff;width:100%;border-left:0;border-right:0;border-top:0;text-align:start}
.row:last-child{border-bottom:0}
.row:active{background:#F8FAFC}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:14px;color:var(--muted)}
.row .end{text-align:end;flex:none}
.row .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--pri-l);color:var(--pri)}
.row .chev{color:#CBD5E1}
.empty{text-align:center;color:var(--muted);padding:34px 16px}
.empty svg{width:46px;height:46px;stroke:#CBD5E1;margin-bottom:6px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:17px;min-height:54px;cursor:pointer;background:var(--pri);color:#fff;width:100%;text-decoration:none}
.btn:active{filter:brightness(.92);transform:scale(.99)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.sec{background:#fff;color:var(--text);border:1.5px solid var(--line)}
.btn.ghost{background:transparent;color:var(--pri);min-height:44px;padding:8px 12px}
.btn.danger{background:var(--danger)} .btn.danger.sec{background:#fff;color:var(--danger);border-color:#F5C2C2}
.btn.sale{background:var(--sale)} .btn.pur{background:var(--pur)}
.btn.wa{background:#1FA855}
.btn.sm{min-height:42px;padding:8px 14px;font-size:15px;border-radius:12px;width:auto}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btns.three{grid-template-columns:1fr 1fr 1fr}
.btns .btn{flex-direction:column;gap:4px;font-size:15px;min-height:76px}
.stack>*+*{margin-top:10px}
.link{background:none;border:0;color:var(--pri);font-weight:700;padding:8px 2px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

/* ---------- home ---------- */
.hello{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
.hello .logo{width:52px;height:52px;border-radius:14px;background:#fff;box-shadow:var(--shadow);object-fit:contain}
.hello .nm{font-size:20px;font-weight:800;line-height:1.2}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.big-act{border:0;border-radius:20px;padding:18px 14px;color:#fff;text-align:start;cursor:pointer;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.big-act svg{width:34px;height:34px;stroke-width:2.2}
.big-act b{font-size:19px;display:block} .big-act span{font-size:14px;opacity:.9}
.big-act.sale{background:linear-gradient(135deg,#10B981,#0E9F6E 60%,#0B8A5F)}
.big-act.pur{background:linear-gradient(135deg,#3B82F6,#2563EB 60%,#1E4FD1)}
.big-act:active{transform:scale(.98)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat .l{font-size:14px;color:var(--muted)} .stat .v{font-size:21px;font-weight:800;direction:ltr;text-align:end}
.stat .v small{font-size:13px;font-weight:500;color:var(--muted)}
.stat.g .v{color:var(--sale)} .stat.bl .v{color:var(--pur)} .stat.r .v{color:var(--danger)} .stat.o .v{color:var(--warn)}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;font-size:15px}
.banner.warn{background:var(--warn-l);color:#92400E} .banner.info{background:var(--pri-l);color:var(--pri-d)} .banner.danger{background:var(--danger-l);color:#991B1B}
.banner .grow{flex:1}

/* ---------- badges ---------- */
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.badge.paid{background:var(--sale-l);color:#047857} .badge.unpaid{background:var(--danger-l);color:#B91C1C}
.badge.partial{background:var(--warn-l);color:#B45309} .badge.void{background:#F1F5F9;color:#64748B}
.badge.sale{background:var(--sale-l);color:#047857} .badge.purchase{background:var(--pur-l);color:#1D4ED8}
.badge.low{background:var(--danger-l);color:#B91C1C} .badge.ok{background:#F1F5F9;color:#334155}
.amt{font-weight:800;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field>label,.lbl{display:block;font-size:15px;font-weight:700;margin-bottom:6px}
.field .hint{font-size:13px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.switch input{display:none}
.switch .tg{width:52px;height:30px;border-radius:999px;background:#CBD5E1;position:relative;transition:.2s;flex:none;cursor:pointer}
.switch .tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.tg{background:var(--pri)} .switch input:checked+.tg::after{inset-inline-start:25px}
.seg{display:flex;background:#E9EEF2;border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px 6px;font-weight:700;color:var(--muted);cursor:pointer;min-height:44px;font-size:15px}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;font-weight:500}
.chip.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d);font-weight:700}
.search{position:relative;margin-bottom:12px}
.search input{padding-inline-start:44px}
.search svg{position:absolute;inset-inline-start:13px;top:14px;color:var(--muted)}

/* ---------- editor ---------- */
.ed-head{display:flex;gap:8px 10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.ed-head .tag{font-weight:800;font-size:18px}
.ed-head input{width:auto;flex:1 1 140px;min-width:0;max-width:190px;margin-inline-start:auto}
.party-box{position:relative}
.sugg{position:absolute;top:100%;right:0;left:0;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:5;overflow:hidden;margin-top:4px}
.sugg button{display:flex;width:100%;justify-content:space-between;border:0;background:#fff;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:start}
.line{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);border-inline-start:5px solid var(--sale)}
.purchase .line{border-inline-start-color:var(--pur)}
.line-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.line-top b{flex:1;font-size:17px}
.x-btn{border:0;background:#F1F5F9;color:var(--muted);width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.line-row{display:flex;gap:8px;align-items:flex-end}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.qty button{width:44px;height:48px;border:0;background:#F8FAFC;font-size:24px;font-weight:700;cursor:pointer;color:var(--pri)}
.qty input{width:62px;border:0;border-radius:0;text-align:center;min-height:48px;padding:6px 2px;box-shadow:none!important}
.line-row .pr{flex:1;min-width:0}
.line-row .pr span{font-size:12px;color:var(--muted);display:block}
.line-row .pr input{min-height:48px;padding:8px 10px}
.line-total{flex:none;min-width:84px;text-align:end;font-weight:800;padding-bottom:12px;direction:ltr}
.line-hint{font-size:13px;color:var(--muted);margin-top:6px}
.line-hint.bad{color:var(--danger)}
.add-line{border:2px dashed #B6C3D1;background:#fff;border-radius:14px;width:100%;padding:16px;font-weight:700;font-size:17px;color:var(--pri);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-bottom:14px}
.totals .tr{display:flex;justify-content:space-between;padding:6px 0;font-size:16px}
.totals .tr.grand{font-size:22px;font-weight:800;border-top:1.5px dashed var(--line);margin-top:6px;padding-top:12px}
.savebar{position:fixed;bottom:0;left:0;right:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--safe-b));display:flex;justify-content:center}
.savebar .wrap{display:flex;gap:10px;align-items:center;width:100%;max-width:612px}
.savebar .tot{flex:none;min-width:110px}
.savebar .tot small{display:block;color:var(--muted);font-size:13px}
.savebar .tot b{font-size:21px;direction:ltr;display:block;text-align:start}

/* ---------- invoice view ---------- */
.inv-img{width:100%;border-radius:12px;box-shadow:var(--shadow);background:#fff;display:block;min-height:200px}
.status-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}

/* ---------- modal / sheet ---------- */
#modal-root .bd{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:81;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:82;background:var(--bg);border-radius:22px 22px 0 0;max-height:90vh;display:flex;flex-direction:column;animation:up .2s ease-out;max-width:640px;margin:0 auto}
.sheet .sh-h{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.sheet .sh-h h3{flex:1;margin:0;font-size:19px}
.sheet .sh-b{overflow:auto;padding:4px 16px calc(18px + var(--safe-b))}
.sheet .grab{width:44px;height:5px;background:#CBD5E1;border-radius:9px;margin:8px auto 0}
.dlg{position:fixed;z-index:82;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,420px);background:#fff;border-radius:20px;padding:22px 18px 16px;animation:pop .15s}
.dlg p{margin:0 0 18px;font-size:18px;text-align:center}
.dlg .btns{margin:0}
.dlg .btns .btn{min-height:52px;flex-direction:row;font-size:17px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translate(-50%,-46%);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toast{position:fixed;bottom:calc(110px + var(--safe-b));left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:12px 20px;border-radius:14px;z-index:90;font-size:16px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}

/* ---------- lock / pin ---------- */
#lock{position:fixed;inset:0;z-index:80;background:linear-gradient(170deg,#0F766E,#134E4A);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px calc(24px + var(--safe-b))}
#lock.on{display:flex}
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 18px calc(28px + var(--safe-b));max-width:520px;margin:0 auto}
.onb .hero{text-align:center;margin-bottom:22px}
.onb .hero .app-ic{width:92px;height:92px;border-radius:26px;margin:0 auto 14px;display:block;box-shadow:0 10px 30px rgba(15,118,110,.3)}
.onb h2{font-size:26px;margin:0 0 6px} .onb .sub{color:var(--muted);font-size:16px}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.steps i{width:28px;height:6px;border-radius:9px;background:#CBD5E1} .steps i.on{background:var(--pri)}
.pin{width:100%;max-width:340px;text-align:center}
.pin-title{font-size:21px;font-weight:700;margin-bottom:4px}
.pin-sub{font-size:15px;opacity:.85;min-height:24px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:20px 0 10px;direction:ltr}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;opacity:.9}
.pin-dots i.f{background:currentColor}
.pin-msg{min-height:26px;font-size:15px;font-weight:700;color:#FCA5A5}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;direction:ltr}
.pin-pad button{height:66px;border-radius:18px;border:0;background:rgba(255,255,255,.14);color:inherit;font-size:28px;font-weight:700;cursor:pointer;font-family:inherit}
.pin-pad button:active{background:rgba(255,255,255,.3)}
.pin-pad button.fn{font-size:15px;background:transparent}
.pin.light{color:var(--text)}
.pin.light .pin-pad button{background:#fff;box-shadow:var(--shadow)}
.pin.light .pin-pad button.fn{background:transparent;box-shadow:none;color:var(--pri)}
.pin.light .pin-msg{color:var(--danger)}
.pin.light .pin-dots i{color:var(--pri)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.code-box{background:#fff;border:2px dashed var(--pri);border-radius:16px;padding:16px 6px;text-align:center;font-size:clamp(17px,5.6vw,26px);font-weight:800;letter-spacing:1px;white-space:nowrap;direction:ltr;font-family:ui-monospace,Menlo,Consolas,monospace;margin:14px 0;color:var(--pri-d);user-select:all}
body.privacy #app,body.privacy #modal-root{filter:blur(18px)}

/* ---------- print ---------- */
#printArea{display:none}
@media print{
  @page{margin:8mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea img{width:100%;display:block}
}
/* ---------- الحقول: تحديد النص وسرعة اللمس ---------- */
input,textarea{-webkit-user-select:text;user-select:text}
button,.row,.chip{touch-action:manipulation}
/* ---------- الحقوق في شاشة الرمز ---------- */
.credits{margin-top:auto;padding-top:18px;text-align:center;font-size:13px;line-height:1.7;color:rgba(255,255,255,.82)}
.credits b{color:#fff;font-weight:700}
.credits .cr-tel{display:inline-flex;align-items:center;gap:6px;margin-top:4px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.credits .cr-tel .i{width:16px;height:16px}
.credits.light{color:var(--muted);margin-top:18px;padding-top:12px}
.credits.light b{color:var(--ink,#0F172A)}
.credits.light .cr-tel{background:var(--pri-l);border-color:transparent;color:var(--pri-d)}
#lock .credits{position:absolute;bottom:calc(14px + var(--safe-b));left:0;right:0;padding:0 16px}
/* ---------- الإعلان ---------- */
.ad-slot{margin:14px 0 4px}
.ad-card{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:18px;padding:14px 14px 14px 12px;text-align:start;cursor:pointer;box-shadow:0 6px 18px rgba(15,23,42,.12)}
.ad-card img{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;background:rgba(255,255,255,.2)}
.ad-t{font-weight:800;font-size:17px}.ad-b{font-size:14px;opacity:.9;margin-top:2px}
.ad-cta{flex:none;font-weight:700;font-size:13px;border-radius:999px;padding:7px 12px}
.ad-tag{position:absolute;top:6px;inset-inline-end:10px;font-size:10px;opacity:.75;border:1px solid currentColor;border-radius:6px;padding:0 5px;line-height:16px}
.ad-up{display:block;margin:6px auto 0;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer}
/* ---------- الباقات ---------- */
.badge.pro{background:#FEF3C7;color:#92400E;font-size:11px;padding:1px 7px;vertical-align:middle;margin-inline-start:4px}
.plan{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.plan.best{border-color:var(--pri);box-shadow:0 8px 24px rgba(15,118,110,.14)}
.plan.cur{background:var(--pri-l)}
.plan-tag{position:absolute;top:-11px;inset-inline-start:16px;background:var(--pri);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.plan-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:19px}
.plan-p{color:var(--pri-d);font-weight:800;font-size:16px}
.plan ul{list-style:none;padding:0;margin:10px 0 12px}
.plan li{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:15px}
.plan li .i{width:18px;height:18px;color:var(--sale);flex:none}
.plan li.no{color:var(--muted)} .plan li.no .i{color:var(--danger)}
.plan-cur{display:flex;align-items:center;gap:6px;justify-content:center;color:var(--pri-d);font-weight:700}
.plan-now{border-inline-start:5px solid var(--pri)}
.steps-ol{margin:0 0 10px;padding-inline-start:20px;font-size:15px;line-height:1.9}
details.card summary{cursor:pointer;list-style:none} details.card summary::-webkit-details-marker{display:none}
.up-ic{width:58px;height:58px;margin:0 auto;border-radius:18px;display:grid;place-items:center;background:#FEF3C7;color:#B45309}
.up-ic .i{width:30px;height:30px}
.locked{position:relative}.locked-blur{filter:blur(6px);opacity:.55;pointer-events:none}
.locked-card{position:relative;margin-top:-60px}
/* ---------- الجولة التعريفية (بالونات شفافة) ---------- */
#tour{position:fixed;inset:0;z-index:95;animation:fade .2s}
#tour.out{opacity:0;transition:opacity .2s}
.tr-spot{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(15,23,42,.55),0 0 0 3px rgba(255,255,255,.85);transition:all .28s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tr-bub{position:fixed;padding:16px 16px 14px;border-radius:22px;color:#0F172A;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border:1px solid rgba(255,255,255,.75);box-shadow:0 18px 40px rgba(15,23,42,.28),inset 0 1px 0 rgba(255,255,255,.9);transition:top .28s,left .28s;animation:float 3.2s ease-in-out infinite}
.tr-bub.pop{animation:pop2 .32s cubic-bezier(.2,1.4,.4,1),float 3.2s ease-in-out .32s infinite}
.tr-tail{position:absolute;top:-9px;width:18px;height:18px;margin-left:-9px;background:inherit;border-left:1px solid rgba(255,255,255,.75);border-top:1px solid rgba(255,255,255,.75);transform:rotate(45deg);border-radius:4px 0 0 0}
.tr-bub.up .tr-tail{top:auto;bottom:-9px;transform:rotate(225deg)}
.tr-step{font-size:12px;color:var(--pri-d);font-weight:700}
.tr-t{font-size:19px;font-weight:800;margin:2px 0 4px}
.tr-d{font-size:15.5px;line-height:1.6;color:#1E293B}
.tr-btns{display:flex;gap:8px;margin-top:12px;align-items:center}
.tr-next{flex:1;border:0;border-radius:14px;padding:11px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer}
.tr-skip{border:0;background:rgba(15,23,42,.06);border-radius:14px;padding:11px 14px;color:#334155;cursor:pointer}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop2{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.tr-bub,.tr-bub.pop{animation:none}.tr-spot{transition:none}}
#lock.on{padding-bottom:calc(118px + var(--safe-b))}
@media (max-width:380px){
  .qty button{width:38px}.qty input{width:46px}
  .line-total{min-width:62px;font-size:15px}
  .line-row .pr input{padding:8px 6px;font-size:16px}
  .line{padding:10px}
}
/* ---------- صور الأصناف المصغّرة ---------- */
.th{width:44px;height:44px;border-radius:12px;flex:none;object-fit:cover;background:#F1F5F9;display:grid;place-items:center}
.th.ph{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);font-weight:800;font-size:19px}
.th.sm{width:34px;height:34px;border-radius:9px;font-size:15px}
.img-pick{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.img-box{width:72px;height:72px;border-radius:16px;background:#F1F5F9;display:grid;place-items:center;flex:none;overflow:hidden;color:#94A3B8;border:1.5px dashed #CBD5E1}
.img-box img{width:100%;height:100%;object-fit:cover}
.img-box .i{width:30px;height:30px}
.img-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.img-btns .btn{width:auto;display:inline-flex;padding:7px 12px;min-height:40px}
.img-btns .btn .i{width:18px;height:18px}
/* ---------- قائمة اختيار الأصناف ---------- */
.sheet.tall{height:90vh}
.sheet.tall .sh-b{flex:1;display:flex;flex-direction:column;padding-bottom:0}
.sheet.tall #pkList{flex:1}
.pk-hint{margin:0 4px 8px}
.row.pk{min-height:66px;user-select:none;-webkit-user-select:none}
.row.pk.sel{background:var(--pri-l)}
.row.pk.out .t{color:var(--muted)}
.pk-in{color:var(--pri-d);font-weight:700}
.pk-q{display:flex;align-items:center;gap:2px;flex:none}
.pk-q button{width:40px;height:40px;border-radius:12px;border:0;background:#fff;color:var(--pri);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pk-q button .i{width:20px;height:20px}
.pk-q .pk-add{background:var(--pri-l);box-shadow:none}
.pk-q b{min-width:34px;text-align:center;font-size:17px;direction:ltr}
.pk-bar{position:sticky;bottom:0;margin:0 -16px;padding:10px 16px calc(12px + var(--safe-b));background:linear-gradient(to top,var(--bg) 78%,rgba(255,255,255,0))}
.pk-bar .btn{box-shadow:0 6px 18px rgba(0,0,0,.16)}
.pk-tot{margin-inline-start:auto;background:rgba(255,255,255,.22);border-radius:10px;padding:2px 10px;font-weight:800}
.sheet.tall .sh-b::after{content:'';display:block;height:calc(14px + var(--safe-b));flex:none}
.sheet.tall .sh-b:has(.pk-bar:not(.hide))::after{display:none}
/* ---------- الباقات ---------- */
.badge.save{background:#DCFCE7;color:#166534;font-size:11.5px;padding:1px 8px;vertical-align:middle}
#perSeg .badge.save{font-size:11px;margin-inline-start:4px}
.lang-seg{margin:0 0 10px}

const License = {
  device: '', data: null,
  async init() {
    let d = await Store.get('device');
    if (!d) { d = randCode(8); await Store.set('device', d); }
    this.device = d;
    const code = await Store.get('license');
    if (code) { const r = await this.verify(code); this.data = (r && !r.err) ? r : null; this.code = this.data ? code : ''; }
  },
  deviceLabel() { return groupCode(this.device); },
  active() { return !!this.data; },
  async verify(code) {
    try {
      const clean = String(code).trim().replace(/\s+/g, '');
      const [p, s] = clean.split('.');
      if (!p || !s) return null;
      const key = await crypto.subtle.importKey('jwk', APP.licenseKey, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, B64.unurl(s), TE.encode(p));

      if (normCode(payload.d) !== normCode(this.device)) return { err: 'device', payload };
      if (payload.p && !['basic', 'advanced'].includes(payload.p)) return null;
      if (payload.e && !/^\d{4}-\d{2}-\d{2}$/.test(payload.e)) return null;

  },

/* ---------- حسابات الفاتورة ---------- */
function calcInvoice(inv) {
  const sub = round((inv.lines || []).reduce((a, l) => a + round(num(l.qty) * num(l.price)), 0));
  const disc = Math.max(0, Math.min(round(inv.discount), sub));
  const base = round(sub - disc);
  const rate = num(inv.vatRate);
  let vat = 0, total = base, net = base;
  if (rate > 0) {
    if (inv.vatInclusive) { net = round(base / (1 + rate / 100)); vat = round(base - net); total = base; }
    else { vat = round(base * rate / 100); total = round(base + vat); }
  }
  return { sub, disc, base, net, vat, total };
}
function paidOf(inv) { return round((inv.payments || []).reduce((a, p) => a + num(p.a), 0)); }
function dueOf(inv) { return inv.void ? 0 : Math.max(0, round(inv.total - paidOf(inv))); }
function statusOf(inv) {
  if (inv.void) return 'void';
  const p = paidOf(inv);
  if (p >= inv.total - 0.0005) return 'paid';
  return p > 0 ? 'partial' : 'unpaid';
}
const STATUS_TXT = { paid: 'مدفوعة', partial: 'مدفوعة جزئياً', unpaid: 'غير مدفوعة', void: 'ملغاة' };

/* ---------- الباركود ---------- */
function ean13Check(d12) { let s = 0; for (let i = 0; i < 12; i++) s += (+d12[i]) * (i % 2 ? 3 : 1); return String((10 - s % 10) % 10); }
function isEan13(c) { return /^\d{13}$/.test(c) && ean13Check(c.slice(0, 12)) === c[12]; }
/* باركود داخلي للمحل (يبدأ بـ 20 حسب نطاق GS1 للاستخدام الداخلي) */
function newBarcode() {
  const used = new Set(DB.items.map(i => i.barcode).filter(Boolean));
  const { c: ctr, P } = devCounters(), lead = P ? '2' + (1 + (PREFIXES.indexOf(P[0]) + 9) % 9) : '20';
  let n = ctr.bc || 0, c;
  do { n++; const d = lead + String(n).padStart(10, '0'); c = d + ean13Check(d); } while (used.has(c));
  ctr.bc = n; return c;
}
function normBarcode(s) { return toEnDigits(String(s || '')).trim().replace(/\s+/g, ''); }
function itemByBarcode(c) { c = normBarcode(c); return c ? DB.items.find(i => !i.archived && i.barcode === c) : null; }

function devCounters() {
  const P = typeof Sync !== 'undefined' ? Sync.prefix() : '';
  if (!P) return { c: DB.counters, P: '' };
  DB.ctr = DB.ctr || {}; DB.ctr[P] = DB.ctr[P] || { sale: 0, purchase: 0 };

function stockMap() {
  const m = {};
  for (const it of DB.items) m[it.id] = num(it.opening);
  for (const inv of DB.invoices) {
    if (inv.void) continue;
    const s = inv.type === 'sale' ? -1 : 1;
    for (const l of inv.lines) if (l.itemId in m) m[l.itemId] = round(m[l.itemId] + s * num(l.qty), 3);
  }

}

function partyBalance(p) {
  const type = p.kind === 'customer' ? 'sale' : 'purchase';
  return round(DB.invoices.filter(i => i.partyId === p.id && i.type === type).reduce((a, i) => a + dueOf(i), 0));
}
function partyInvoices(p) { return DB.invoices.filter(i => i.partyId === p.id).sort((a, b) => (b.date + b.created).localeCompare(a.date + a.created)); }
function applyPartyPayment(p, amount, method, date) {
  let left = round(amount);
  const type = p.kind === 'customer' ? 'sale' : 'purchase';
  const list = DB.invoices.filter(i => i.partyId === p.id && i.type === type && dueOf(i) > 0).sort((a, b) => (a.date + a.created).localeCompare(b.date + b.created));
  for (const inv of list) {
    if (left <= 0) break;
    const a = Math.min(left, dueOf(inv));
    inv.payments.push({ d: date || today(), a: round(a), m: method || 'cash' });
    inv.paid = paidOf(inv); left = round(left - a);
  }
  return left; // المبلغ الزائد إن وجد
}

/* ---------- التقارير ---------- */
function periodRange(key, from, to) {
  const t = today(), d = new Date();
  if (key === 'today') return [t, t];
  if (key === 'week') { const dow = (d.getDay() + 1) % 7; return [addDays(t, -dow), t]; } // الأسبوع يبدأ السبت
  if (key === 'month') return [t.slice(0, 8) + '01', t];
  if (key === 'last') { const f = new Date(d.getFullYear(), d.getMonth() - 1, 1), e = new Date(d.getFullYear(), d.getMonth(), 0); return [ymd(f), ymd(e)]; }
  if (key === 'year') return [t.slice(0, 4) + '-01-01', t];
  return [from || t, to || t];
}
function report(from, to) {
  const r = { sales: 0, salesNet: 0, salesVat: 0, purchases: 0, purVat: 0, cogs: 0, salesCount: 0, purCount: 0, salesDue: 0, purDue: 0, collected: 0, paidOut: 0, items: {} };
  for (const inv of DB.invoices) {
    if (inv.void || inv.date < from || inv.date > to) continue;
    const c = calcInvoice(inv);
    if (inv.type === 'sale') {
      r.sales += c.total; r.salesNet += (c.total - c.vat); r.salesVat += c.vat; r.salesCount++; r.salesDue += dueOf(inv);
      const ratio = c.sub > 0 ? (c.total - c.vat) / c.sub : 1;
      for (const l of inv.lines) {
        const it = itemById(l.itemId); const q = num(l.qty);
        r.cogs += q * num(it ? it.cost : 0);
        const k = l.itemId || l.name; r.items[k] = r.items[k] || { name: l.name, qty: 0, amount: 0 };
        r.items[k].qty += q; r.items[k].amount += num(l.qty) * num(l.price) * ratio;
      }
    } else { r.purchases += c.total; r.purVat += c.vat; r.purCount++; r.purDue += dueOf(inv); }
  }
  for (const inv of DB.invoices) {
    if (inv.void) continue;
    for (const p of inv.payments || []) { if (p.d >= from && p.d <= to) { if (inv.type === 'sale') r.collected += num(p.a); else r.paidOut += num(p.a); } }
  }
  ['sales', 'salesNet', 'salesVat', 'purchases', 'purVat', 'cogs', 'salesDue', 'purDue', 'collected', 'paidOut'].forEach(k => r[k] = round(r[k]));
  r.profit = round(r.salesNet - r.cogs);
  r.top = Object.values(r.items).sort((a, b) => b.amount - a.amount).slice(0, 7);
  return r;
}

function totalPayable() { return round(DB.invoices.filter(i => i.type === 'purchase').reduce((a, i) => a + dueOf(i), 0)); }

'use strict';
/* =====================================================================
   الباقات والاشتراكات (Google Play + أكواد التفعيل) والإحصائيات والإعلان
   ===================================================================== */

/* ---------- الباقات (عدّل الميزات والأسعار من هنا) ---------- */
/* price/priceY: بالريال العماني لأكواد التفعيل (واتساب). usd/usdY: أسعار Google Play المقترحة (تُضبط في Play Console) */
const PLANS = {
  free: { id: 'free', name: 'المجانية', price: 0, priceY: 0, limit: 20, ads: true, feats: [] },
  basic: { id: 'basic', name: 'الأساسية', price: 0.750, priceY: 7.000, usd: 1.99, usdY: 17.99, limit: 0, ads: false, feats: ['unlimited', 'noads', 'wholesale', 'pdf', 'print', 'logo', 'cloud'] },
  advanced: { id: 'advanced', name: 'المتقدمة', price: 2.300, priceY: 21.000, usd: 5.99, usdY: 54.99, limit: 0, ads: false, feats: ['unlimited', 'noads', 'wholesale', 'pdf', 'print', 'logo', 'cloud', 'reports', 'export', 'vat', 'bilingual', 'autotr', 'barcode', 'remind', 'users', 'receipt'] }
};
const PLAN_RANK = { free: 0, basic: 1, advanced: 2 };
const FEAT_TXT = {
  unlimited: 'فواتير بلا حد شهري', noads: 'بدون إعلانات', pdf: 'حفظ الفاتورة PDF', print: 'طباعة الفواتير', logo: 'شعار محلك على الفاتورة',
  reports: 'التقارير والأرباح', export: 'تصدير Excel', vat: 'ضريبة القيمة المضافة', bilingual: 'فاتورة بالعربية والإنجليزية', remind: 'تذكير العملاء المتأخرين بجدولة تلقائية عبر واتساب والبريد',
  wholesale: 'فواتير البيع بالجملة مع السعر المقترح للبيع', autotr: 'ترجمة أسماء الأصناف للإنجليزية تلقائياً', barcode: 'باركود لكل صنف وطباعة الملصقات بالبلوتوث',
  cloud: 'إدارة المحل من الكمبيوتر بمزامنة سحابية مشفّرة', users: 'مستخدمون إضافيون بصلاحيات (حتى 5)', receipt: 'طباعة الفاتورة على طابعة إيصالات حرارية'
};
const BASE_FEATS = ['فواتير بيع (مفرد) وشراء', 'المخزون والعملاء والديون', 'صور الأصناف وقائمة اختيار سريعة', 'إرسال الفاتورة صورة عبر واتساب', 'التطبيق بالعربية أو الإنجليزية', 'النسخ الاحتياطي المشفّر والتلقائي'];
const PLAY_SKU = { basic: 'fawateeri_basic', advanced: 'fawateeri_advanced' };
const PLAY_BASE = { m: 'monthly', y: 'yearly' };   // معرّفات الخطط الأساسية في Play Console
const TRIAL_DAYS = 7;                              // عرض التجربة المجانية على الخطة الشهرية (المعرّف: trial7)
const PERIOD_TXT = { m: 'شهرياً', y: 'سنوياً' };
function yearSave(id) { const P = PLANS[id]; return P.price ? Math.round((1 - P.priceY / (P.price * 12)) * 100) : 0; }

/* ---------- الباقة الحالية ---------- */
const Plan = {
  id: 'free', src: null, exp: null, clock: 0,
  async init() { this.clock = (await Store.get('clock')) || 0; this.compute(); },
  now() { return Math.max(Date.now(), this.clock || 0); },
  async tick(serverNow) {
    const t = Math.max(Date.now(), +serverNow || 0);
    if (t > (this.clock || 0) + 60000) { this.clock = t; await Store.set('clock', t); this.compute(); }
  },
  compute() {
    let best = { id: 'free', src: null, exp: null };
    const L = License.data, d = ymd(new Date(this.now()));
    if (L) {
      const p = PLANS[L.p] ? L.p : 'advanced'; // الأكواد القديمة بدون باقة = متقدمة دائمة
      if ((!L.e || L.e >= d) && PLAN_RANK[p] > PLAN_RANK[best.id]) best = { id: p, src: 'code', exp: L.e || null };
    }
    const B = Billing.active;
    if (B && PLAN_RANK[B.plan] >= PLAN_RANK[best.id] && B.plan !== 'free') best = { id: B.plan, src: 'play', exp: B.exp || null };
    this.ownId = best.id; this.ownSrc = best.src; this.ownExp = best.exp;
    /* جهاز مرتبط بمتجر (كمبيوتر أو موظف): يأخذ باقة المتجر من جوال المالك */
    const SP = typeof Sync !== 'undefined' && Sync.linked() && Sync.storePlan;
    if (SP && PLAN_RANK[SP.id] > PLAN_RANK[best.id] && (!SP.exp || SP.exp >= d)) best = { id: SP.id, src: 'store', exp: SP.exp };
    Object.assign(this, best);
  },
  cfg() { return PLANS[this.id]; },
  can(f) { return this.cfg().feats.includes(f); },
  ads() { return this.cfg().ads; },
  paid() { return this.id !== 'free'; },
  minFor(f) { return ['basic', 'advanced'].find(p => PLANS[p].feats.includes(f)) || 'advanced'; },
  monthCount() { const m = ymd().slice(0, 7); return DB ? DB.invoices.filter(i => ymd(new Date(i.created || 0)).slice(0, 7) === m).length : 0; },
  limitLeft() { const l = this.cfg().limit; return l ? Math.max(0, l - this.monthCount()) : Infinity; },
  daysLeft() { if (!this.exp) return Infinity; return Math.ceil((new Date(this.exp + 'T23:59:59').getTime() - this.now()) / 864e5); },
  codeExpired() { const L = License.data; return !!(L && L.e && L.e < ymd(new Date(this.now()))); },
  srcTxt() { return this.src === 'play' ? 'عبر Google Play' : this.src === 'code' ? 'بكود تفعيل' : this.src === 'store' ? 'اشتراك المتجر' : ''; }
};

/* ---------- اشتراكات Google Play ---------- */
const Billing = {
  P: null, ready: false, products: {}, active: null,
  avail() { return FW_CHANNEL === 'play' && isNative(); },
  plugin() {
    const C = window.Capacitor; if (!C) return null;
    if (C.Plugins && C.Plugins.NativePurchases) return C.Plugins.NativePurchases;
    try { return C.registerPlugin ? C.registerPlugin('NativePurchases') : null; } catch (e) { return null; }
  },
  async init() {
    const c = await Store.get('playEnt');
    if (c && Date.now() - c.at < 7 * 864e5) this.active = { plan: c.plan, exp: c.exp || null };
    if (!this.avail()) { this.active = null; return; }
    try {
      this.P = this.plugin(); if (!this.P) return;
      const s = await this.P.isBillingSupported(); if (!s || !s.isBillingSupported) return;
      this.ready = true; await this.refresh(); this.loadProducts();
    } catch (e) { console.warn('billing init', e); }
  },
  /* products[plan][m|y] = { price, base, token, trial: { token, days } } — Google Play يعيد التجربة فقط لمن يستحقها */
  async loadProducts() {
    try {
      const r = await this.P.getProducts({ productIdentifiers: Object.values(PLAY_SKU), productType: 'subs' });
      const out = {};
      for (const p of (r && r.products) || []) {
        const plan = Object.keys(PLAY_SKU).find(k => PLAY_SKU[k] === p.planIdentifier);
        const per = Object.keys(PLAY_BASE).find(k => PLAY_BASE[k] === p.identifier) || (/year|annual/i.test(p.identifier || '') ? 'y' : 'm');
        if (!plan) continue;
        const o = (out[plan] = out[plan] || {}), e = (o[per] = o[per] || { base: p.identifier });
        if (!p.offerId) { e.price = p.priceString; e.num = +p.price || 0; e.token = p.offerToken; }
        else {
          const ip = p.introductoryPrice;
          if (ip && +ip.price === 0) {
            const sp = ip.subscriptionPeriod || {}, mul = { day: 1, week: 7, month: 30, year: 365 }[sp.unitString] || ({ 0: 1, 1: 7, 2: 30, 3: 365 }[sp.unit] || 1);
            e.trial = { token: p.offerToken, days: (sp.numberOfUnits || TRIAL_DAYS) * mul * Math.max(1, ip.numberOfPeriods || 1) };
          }
          if (!e.price && p.priceString) e.price = p.priceString;
        }
      }
      this.products = out;
    } catch (e) { console.warn('billing products', e); }
  },
  prod(plan, per) { return (this.products[plan] || {})[per] || null; },
  async refresh() {
    if (!this.ready) return;
    try {
      const r = await this.P.getPurchases({ productType: 'subs' });
      let best = null;
      for (const t of (r && r.purchases) || []) {
        const plan = Object.keys(PLAY_SKU).find(k => PLAY_SKU[k] === t.productIdentifier);
        if (!plan) continue;
        if (t.purchaseState != null && String(t.purchaseState) !== '1') continue;
        if (t.expirationDate && new Date(t.expirationDate).getTime() < Date.now()) continue;
        if (t.subscriptionState && ['expired', 'revoked'].includes(t.subscriptionState)) continue;
        if (!best || PLAN_RANK[plan] > PLAN_RANK[best.plan]) best = { plan, exp: t.expirationDate ? String(t.expirationDate).slice(0, 10) : null };
      }
      this.active = best;
      await Store.set('playEnt', best ? { plan: best.plan, exp: best.exp, at: Date.now() } : null);
    } catch (e) { console.warn('billing refresh', e); }
    Plan.compute();
  },
  async buy(plan, per = 'm') {
    if (!this.ready) { toast('خدمة Google Play غير متاحة على هذا الجهاز'); return false; }
    const pr = this.prod(plan, per), tr = pr && pr.trial;
    Cloud.ev('buy_start', { p: plan, y: per, tr: tr ? 1 : 0 });
    try {
      Lock.grace(300000);
      const args = { productIdentifier: PLAY_SKU[plan], planIdentifier: (pr && pr.base) || PLAY_BASE[per], productType: 'subs' };
      const tok = (tr && tr.token) || (pr && pr.token); if (tok) args.offerToken = tok;
      await this.P.purchaseProduct(args);
      await this.refresh();
      if (Plan.id === plan || PLAN_RANK[Plan.id] >= PLAN_RANK[plan]) { Cloud.ev('buy_ok', { p: plan, s: 'play', y: per, tr: tr ? 1 : 0 }); Cloud.sync(); return true; }
    } catch (e) {
      const m = String((e && (e.message || e.code)) || e);
      Cloud.ev('buy_fail', { p: plan, y: per, m: m.slice(0, 60) });
      if (!/cancel/i.test(m)) toast('لم تكتمل عملية الاشتراك');
    }
    return false;
  },
  async restore() {
    if (!this.ready) return;
    try { await this.P.restorePurchases(); } catch (e) { }
    await this.refresh();
  },
  manage() { if (this.ready) { Lock.grace(300000); this.P.manageSubscriptions().catch(() => { }); } }
};

/* ---------- الإحصائيات المجهولة والإعدادات عن بُعد ---------- */
const ESSENTIAL_EV = new Set(['install', 'buy_start', 'buy_ok', 'buy_fail', 'lic_ok']);
const Cloud = {
  iid: '', q: [], cfg: null, on: true, busy: false, saveT: null, lastSync: 0, fastT: 0, pushed: false,
  async init() {
    this.iid = await Store.get('iid');
    if (!this.iid) { this.iid = randCode(16); await Store.set('iid', this.iid); }
    this.q = (await Store.get('evq')) || [];
    this.cfg = await Store.get('cfg');
    this.on = (await Store.get('stats')) !== false;
    if (!(await Store.get('installed'))) { await Store.set('installed', Date.now()); this.ev('install', { ch: FW_CHANNEL }); }
    setInterval(() => this.sync(), 5 * 60000);
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.sync(); });
    addEventListener('online', () => this.sync());
  },
  /* تفعيل مباشر من لوحة التحكم: الكود موقّع رقمياً ومرتبط بهذا الجهاز، فيُتحقق منه هنا كما لو أدخله التاجر */
  async gotPush(code) {
    if (typeof code !== 'string' || code.length > 2000 || (License.data && code === (await Store.get('license')))) return;
    const before = Plan.id, r = await License.activate(code);
    if (r !== 'ok') { console.warn('push license', r); return; }
    Plan.compute(); this.ev('lic_ok', { p: License.data.p || 'advanced', s: 'push' });
    setTimeout(() => this.sync(true), 1500); // تأكيد الاستلام للوحة التحكم
    if (DB && !Lock.on) {
      const c = Nav.cur(); if (c && !['editor', 'item', 'partyEdit', 'setBiz', 'setInv', 'labelSet'].includes(c.name)) { const y = scrollY; render(); scrollTo(0, y); }
      if (typeof toast === 'function') toast(Plan.id !== before ? 'تم تفعيل الباقة ' + Plan.cfg().name + ' 🎉' : 'تم تحديث اشتراكك ✓', 4000);
    } else this.pushed = true;
  },
  /* أثناء انتظار التاجر في شاشة الاشتراك نتحقق كل 12 ثانية ليظهر التفعيل خلال لحظات */
  fast(on) {
    clearInterval(this.fastT); this.fastT = 0;
    if (!on || !API.url || FW_DEMO) return;
    const until = Date.now() + 15 * 60000;
    this.fastT = setInterval(() => { if (Date.now() > until || document.hidden) { if (Date.now() > until) this.fast(false); return; } this.sync(true); }, 12000);
  },
  async setOn(v) { this.on = !!v; await Store.set('stats', this.on); if (!v) { this.q = this.q.filter(e => ESSENTIAL_EV.has(e.n)); this.save(); } },
  ev(n, p) {
    if (!this.on && !ESSENTIAL_EV.has(n)) return;
    this.q.push(p ? { n, t: Date.now(), p } : { n, t: Date.now() });
    if (this.q.length > 400) this.q = this.q.slice(-400);
    this.save();
  },
  save() { clearTimeout(this.saveT); this.saveT = setTimeout(() => Store.set('evq', this.q).catch(() => { }), 400); },
  platform() {
    if (isNative()) return (window.Capacitor.getPlatform && window.Capacitor.getPlatform()) || 'native';
    return /iPhone|iPad|iPod/.test(navigator.userAgent) ? 'ios-web' : /Android/.test(navigator.userAgent) ? 'android-web' : 'web';
  },
  os() {
    const u = navigator.userAgent; let m;
    if ((m = /Android ([\d.]+)/.exec(u))) return 'Android ' + m[1].split('.')[0];
    if ((m = /OS (\d+)_/.exec(u)) && /iPhone|iPad/.test(u)) return 'iOS ' + m[1];
    return /Windows/.test(u) ? 'Windows' : /Mac OS/.test(u) ? 'macOS' : 'Other';
  },
  async sync(force) {
    if (!API.url || this.busy || FW_DEMO) return;
    if (navigator.onLine === false) return;
    if (!force && Date.now() - this.lastSync < 20000) return;
    this.busy = true; this.lastSync = Date.now();
    const batch = this.q.slice(0, 120);
    const p = {
      iid: this.iid, dc: License.device, v: APP.version, ch: FW_CHANNEL, pf: this.platform(), os: this.os(),
      lang: (navigator.language || '').slice(0, 10), tz: (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return ''; } })(),
      plan: Plan.id, ps: Plan.src, pe: Plan.exp, lic: License.data ? License.data.i : null, an: this.on,
      c: (this.on && DB) ? { inv: DB.invoices.length, im: Plan.monthCount(), it: DB.items.length, pa: DB.parties.length } : null,
      ev: batch
    };
    try {
      const ctl = window.AbortController ? new AbortController() : null; const to = ctl ? setTimeout(() => ctl.abort(), 15000) : 0;
      const r = await fetch(API.url + '/rest/v1/rpc/fw_sync', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: API.key }, body: JSON.stringify({ p }), signal: ctl ? ctl.signal : undefined });
      clearTimeout(to);
      if (r.ok) {
        const j = await r.json();
        this.q.splice(0, batch.length); this.save();
        if (j && typeof j === 'object') {
          this.cfg = j; await Store.set('cfg', j);
          if (j.now) await Plan.tick(j.now);
          if (j.lic === 'revoked' && License.data) { await License.revoke(); Plan.compute(); if (DB && !Lock.on) render(); }
          if (j.push) await this.gotPush(j.push);
          Ads.refresh();

/* PDF بسيط يحتوي صورة الفاتورة (بدون مكتبات خارجية) */
async function canvasToPdf(cv) {

  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  obj(4, () => { push(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`); push(jpeg); push('\nendstream'); });
  const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  const xref = len;
  push('xref\n0 6\n0000000000 65535 f \n' + [1, 2, 3, 4, 5].map(n => String(offs[n]).padStart(10, '0') + ' 00000 n \n').join(''));
  push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(chunks, { type: 'application/pdf' });
}

/* =====================================================================

/* ---------- الترجمة التلقائية لأسماء الأصناف (عند توفر الإنترنت) ----------
   تُرسل أسماء الأصناف فقط (بدون أي بيانات أخرى) إلى خدمة MyMemory المجانية للترجمة */
const TR_URL = 'https://api.mymemory.translated.net/get';
const Tr = {
  q: [], busy: false, fails: 0, pauseUntil: 0,
  on() { return !!(DB && DB.settings.autoTr && Plan.can('autotr')); },
  need(it) { return it && !it.archived && it.name && (!it.nameEn || (it.trAuto && it.trSrc !== it.name)); },
  queue(ids, force) {
    if (!this.on() && !force) return;
    for (const id of [].concat(ids)) if (id && !this.q.includes(id)) this.q.push(id);
    this.run();
  },
  queueAll() { this.queue(DB.items.filter(i => this.need(i)).map(i => i.id)); },
  clean(t, src) {
    t = String(t || '').replace(/&#(\d+);/g, (_, n) => String.fromCharCode(+n)).replace(/&(quot|amp|lt|gt|apos);/g, m => ({ '&quot;': '"', '&amp;': '&', '&lt;': '<', '&gt;': '>', '&apos;': "'" }[m]));
    t = t.replace(/[‎‏"«»]/g, '').replace(/\s+/g, ' ').trim().replace(/[.。]+$/, '');
    if (!t || /[؀-ۿ]/.test(t) || /MYMEMORY|QUERY LENGTH|INVALID|PLEASE SELECT/i.test(t) || t.length > 120) return '';
    const small = new Set(['and', 'or', 'of', 'with', 'for', 'the', 'a', 'an', 'in', 'to']);
    return t.split(' ').map((w, i) => (i && small.has(w.toLowerCase())) ? w.toLowerCase() : /^[a-z]/.test(w) ? w[0].toUpperCase() + w.slice(1) : w).join(' ');
  },
  async one(name) {
    const src = toEnDigits(name).trim();
    const ctl = window.AbortController ? new AbortController() : null, to = ctl ? setTimeout(() => ctl.abort(), 12000) : 0;
    try {
      const r = await fetch(`${TR_URL}?q=${encodeURIComponent(src)}&langpair=ar|en`, { signal: ctl ? ctl.signal : undefined, credentials: 'omit', referrerPolicy: 'no-referrer' });
      if (!r.ok) throw new Error('http ' + r.status);
      const j = await r.json();
      if (j.quotaFinished) { this.pauseUntil = Date.now() + 6 * 3600e3; throw new Error('quota'); }
      if (String(j.responseStatus) !== '200') throw new Error('status ' + j.responseStatus);
      return this.clean(j.responseData && j.responseData.translatedText, src);
    } finally { clearTimeout(to); }
  },
  /* ترجمة فورية بطلب التاجر (زر «ترجم» في شاشة الصنف) */
  async now(name) {
    if (navigator.onLine === false) throw new Error('offline');
    return this.one(name);
  },
  async run() {
    if (this.busy || !this.q.length || navigator.onLine === false || Date.now() < this.pauseUntil || !DB) return;
    this.busy = true; let done = 0;
    try {
      while (this.q.length && navigator.onLine !== false && DB) {
        const id = this.q[0], it = itemById(id);
        if (!this.need(it)) { this.q.shift(); continue; }
        let en = '';
        try { en = await this.one(it.name); this.fails = 0; }
        catch (e) { if (++this.fails >= 3 || /quota/.test(e.message)) { this.fails = 0; break; } await sleep(1500); continue; }
        this.q.shift();
        const cur = itemById(id);
        if (en && cur && this.need(cur)) { cur.nameEn = en; cur.trAuto = true; cur.trSrc = cur.name; done++; }
        await sleep(350);
      }
    } finally { this.busy = false; }
    if (done) {
      await persist(); Cloud.ev('tr_auto', { n: done });
      if (Draft) Draft.lines.forEach(l => { if (!l.nameEn) { const it = l.itemId && itemById(l.itemId); if (it && it.nameEn) l.nameEn = it.nameEn; } });
      const c = Nav.cur(); if (c && !Lock.on && ['items', 'invoice'].includes(c.name)) { const y = scrollY; render(); scrollTo(0, y); }
    }
  }
};

/* ---------- ترميز الباركود: EAN-13 للأكواد الرقمية القياسية، و Code 128 لغيرها ---------- */
const EAN_L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'];
const EAN_G = ['0100111', '0110011', '0011011', '0100001', '0011101', '0111001', '0000101', '0010001', '0001001', '0010111'];
const EAN_R = ['1110010', '1100110', '1101100', '1000010', '1011100', '1001110', '1010000', '1000100', '1001000', '1110100'];
const EAN_PAR = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];
const C128 = ('212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 ' +
  '221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 ' +
  '231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 ' +
  '314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 ' +
  '111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 ' +
  '114131 311141 411131 211412 211214 211232 2331112').split(' ');
const Barcode = {
  valid(c) { return /^[\x20-\x7E]{1,32}$/.test(c || ''); },
  /* يعيد سلسلة من 0 و 1 (1 = خط أسود) بدون المنطقة الهادئة */
  modules(code) {
    if (isEan13(code)) {
      const f = +code[0], par = EAN_PAR[f]; let m = '101';
      for (let i = 1; i <= 6; i++) m += (par[i - 1] === 'L' ? EAN_L : EAN_G)[+code[i]];
      m += '01010';

    }
    const vals = [];
    const digits = /^\d+$/.test(code) && code.length >= 4;
    if (digits) {
      vals.push(105);
      const ev = code.length - (code.length % 2);
      for (let i = 0; i < ev; i += 2) vals.push(+code.slice(i, i + 2));
      if (code.length % 2) { vals.push(100); vals.push(code.charCodeAt(code.length - 1) - 32); }

  /* SVG للعرض داخل التطبيق */

    let r = '', x = 0;
    while (x < bits.length) { if (bits[x] === '1') { let w = 1; while (bits[x + w] === '1') w++; r += `<rect x="${x + q}" y="0" width="${w}" height="${h}"/>`; x += w; } else x++; }
    return `<svg class="bc-svg" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" aria-label="${esc(code)}"><rect width="${W}" height="${h}" fill="#fff"/><g fill="#000">${r}</g></svg>`;
  }
};

/* ---------- ملف النسخة الاحتياطية (مشفّر بنفس مفتاح البيانات) ---------- */
async function makeBackup(opts = {}) {
  await Vault.chain;
  const meta = await Store.get('meta'), data = await Store.get('data'), imgs = await Store.get('imgs');
  const bk = {
    app: 'fawateeri', kind: 'backup', v: 2, auto: !!opts.auto, created: new Date().toISOString(), biz: DB.settings.bizName, count: DB.invoices.length,
    meta: { v: meta.v, iter: meta.iter, salt: meta.salt, saltR: meta.saltR, wrapPin: meta.wrapPin, wrapRec: meta.wrapRec }, data,
    dc: License.device, lic: (await Store.get('license')) || undefined

  if (!meta.wrapRec) delete bk.meta.wrapRec;
  /* حماية أقوى: النسخة تُفتح برمز الاستعادة فقط (الرمز السري 6 أرقام يمكن تخمينه إذا أُخذ الملف) */
  if (opts.strong && meta.wrapRec) { delete bk.meta.wrapPin; delete bk.meta.salt; bk.strong = true; }
  if (imgs) bk.imgs = imgs;
  return bk;
}
/* بعد إعادة التثبيت: نسترجع رمز الجهاز القديم ليبقى كود الاشتراك صالحاً (فقط إذا كان التطبيق جديداً بلا بيانات) */
async function adoptDevice(bk) {
  try {
    if (!bk || !bk.dc || !/^[A-Z0-9]{8}$/.test(normCode(bk.dc)) || normCode(bk.dc) === normCode(License.device)) return false;
    if (License.data) return false; // جهاز عليه اشتراك فعّال: لا نغيّر رمزه
    await Store.set('device', normCode(bk.dc)); License.device = normCode(bk.dc);
    if (bk.lic) { const r = await License.activate(bk.lic); if (r !== 'ok') console.warn('restore lic', r); }
    Plan.compute(); Cloud.ev('device_adopt', { l: License.data ? 1 : 0 });
    return true;
  } catch (e) { console.warn('adoptDevice', e); return false; }
}

/* ---------- النسخ التلقائي في ذاكرة الجوال (أندرويد: Documents/Fawateeri) ----------

const AutoBk = {

  fs() { const C = window.Capacitor; return C && C.Plugins && C.Plugins.Filesystem; },

  async init() {
    const c = (await Store.get('autoBk')) || {};
    this.on = c.on !== false; this.strong = !!c.strong; this.last = c.last || 0; this.inst = c.inst || randCode(6); this.err = c.err || '';
    if (!c.inst) await this.save();

  },
  save() { return Store.set('autoBk', { on: this.on, strong: this.strong, last: this.last, inst: this.inst, err: this.err }); },
  mark() { if (!this.avail() || !this.on) return; this.dirty = true; clearTimeout(this.t); this.t = setTimeout(() => this.run(), 45000); },
  async setOn(v) { this.on = !!v; await this.save(); if (v) await this.run(true); },
  async perm() {

  },
  async run(force) {
    if (!this.avail() || !this.on || this.busy || !DB || !Vault.key) return false;
    if (!force && !this.dirty) return false;
    if (!force && Date.now() - this.last < 3 * 3600e3) { clearTimeout(this.t); this.t = setTimeout(() => this.run(), 3 * 3600e3 - (Date.now() - this.last) + 5000); return false; }
    this.busy = true;
    try {
      const F = this.fs();
      if (!(await this.perm())) throw new Error('permission');
      const bk = await makeBackup({ auto: true, strong: this.strong });
      const name = `fawateeri-auto-${this.inst}-${today()}.txt`;
      await F.writeFile({ path: `${this.folder}/${name}`, data: JSON.stringify(bk), directory: 'DOCUMENTS', encoding: 'utf8', recursive: true });

    const mine = ((r && r.files) || []).map(f => typeof f === 'string' ? f : f.name).filter(n => n && n.startsWith(`fawateeri-auto-${this.inst}-`)).sort();
    for (const n of mine.slice(0, Math.max(0, mine.length - 5))) await F.deleteFile({ path: `${this.folder}/${n}`, directory: 'DOCUMENTS' }).catch(() => { });
  }

/* ---------- تذكير العملاء المتأخرين عن الدفع (الباقة المتقدمة) ---------- */
const REM_DEF = { on: false, after: 3, every: 7, max: 3, time: '10:00', ch: 'wa', terms: 0, lang: '' };
const REM_MSG = {
  ar: 'السلام عليكم {name}،\nنود تذكيركم بأن المبلغ المستحق لدينا هو {amount}{since}.\nالفواتير: {invoices}\nشاكرين تعاملكم معنا.\n{biz} {phone}',

const Remind = {
  cfg() { return Object.assign({}, REM_DEF, DB.settings.remind || {}); },
  lang() { const c = this.cfg(); return c.lang || (invLangDefault() === 'en' ? 'en' : 'ar'); },
  rem(p) { return p.rem || {}; },
  /* أقدم تاريخ استحقاق لفاتورة غير مسددة لهذا العميل */
  info(p) {
    const list = DB.invoices.filter(i => i.partyId === p.id && i.type === 'sale' && dueOf(i) > 0).sort((a, b) => (a.dueDate || a.date).localeCompare(b.dueDate || b.date));
    const bal = round(list.reduce((a, i) => a + dueOf(i), 0));
    const t = today(), overdue = list.filter(i => (i.dueDate || i.date) <= t);

  },
  /* تاريخ التذكير القادم أو null */
  next(p, inf = this.info(p)) {

    if (inf.bal <= 0 || r.mode === 'off') return null;
    if (r.next) return r.next; // موعد حدّده التاجر بنفسه
    const auto = r.mode === 'custom' || c.on;

function hardenInputs(root) {

/* تنفيذ مؤجل للبحث: لا يعيد رسم القائمة مع كل حرف ولا أثناء تركيب الكلمة في لوحة المفاتيح */
function liveInput(inputEl, fn, ms = 160) {
  let t = 0, comp = false;
  const run = () => { clearTimeout(t); t = setTimeout(() => fn(inputEl.value), ms); };
  inputEl.addEventListener('compositionstart', () => { comp = true; });
  inputEl.addEventListener('compositionend', () => { comp = false; run(); });
  inputEl.addEventListener('input', e => { if (comp || e.isComposing) return; run(); });
}

const Lock = {
  on: false, last: Date.now(), hiddenAt: 0, graceUntil: 0,
  grace(ms = 120000) { this.graceUntil = Date.now() + ms; },
  mins() { return DB ? num(DB.settings.lockMinutes) : 3; },
  lock() {
    if (this.on || !Vault.ready()) return;
    this.on = true; Vault.lock(); Modal.closeAll();
    $('#view').innerHTML = ''; showLockScreen();
  },
  init() {
    ['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, () => { this.last = Date.now(); }, { passive: true }));
    setInterval(() => {
      if (this.on || !Vault.unlocked() || Vault.auto()) return;
      const m = Math.max(1, this.mins());
      if (Date.now() - this.last > m * 60000 && Date.now() > this.graceUntil) this.lock();
    }, 10000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { this.hiddenAt = Date.now(); if (Vault.unlocked()) document.body.classList.add('privacy'); return; }
      document.body.classList.remove('privacy');
      if (!Vault.unlocked() || this.on || Vault.auto()) return;
      if (Date.now() - this.hiddenAt >= this.mins() * 60000 && Date.now() > this.graceUntil) this.lock();
      this.last = Date.now();
    });
  }
};

/* ---------- استعادة نسخة احتياطية ---------- */
function readBackupFile() {
  return new Promise(res => {
    const f = document.createElement('input'); f.type = 'file'; f.accept = '.txt,.json,text/plain,application/json';
    f.onchange = async () => {
      const file = f.files[0]; if (!file) return res(null);
      try { const j = JSON.parse(await file.text()); if (j.app !== 'fawateeri' || !j.meta || !j.data) throw 0; res(j); }
      catch (e) { toast('هذا الملف ليس نسخة احتياطية صالحة'); res(null); }
    };
    Lock.grace(); f.click();
  });
}
function unlockBackup(bk) {
  return Modal.open('<div class="pinbox"></div><div class="center"><button class="link" id="ubRec">استخدام رمز الاستعادة بدلاً من ذلك</button></div>', {
    title: 'فتح النسخة الاحتياطية', onMount(el) {
      if (!bk.meta.wrapPin) { setTimeout(() => $('#ubRec', el).click(), 0); }
      pinPad($('.pinbox', el), {
        title: 'أدخل الرمز السري للنسخة', sub: 'الرمز الذي كان مستخدماً عند إنشاء النسخة', light: true, onDone: async pin => {
          const raw = await Vault.tryPin(pin, bk.meta); if (!raw) return 'الرمز غير صحيح';
          Modal.close({ raw, pin }); return true;
        }
      });
      $('#ubRec', el).onclick = () => {
        $('.sh-b', el).innerHTML = `<div class="field"><label>رمز الاستعادة</label><input id="ubIn" class="num" style="text-align:center;font-size:20px" placeholder="XXXX-XXXX-XXXX-XXXX"></div><div id="ubMsg" class="pin-msg" style="color:var(--danger)"></div><button class="btn" id="ubGo">فتح</button>`;
        $('#ubGo', el).onclick = async () => {
          const raw = await Vault.tryRecovery($('#ubIn', el).value, bk.meta);
          if (!raw) { $('#ubMsg', el).textContent = 'رمز الاستعادة غير صحيح'; return; }
          Modal.close({ raw, rec: true });
        };
      };
    }
  });
}
async function adoptBackup(bk, unlocked) {
  const meta = Object.assign({}, bk.meta, { fails: 0, lockUntil: 0 });
  await Vault.chain;
  await Store.set('meta', meta); await Store.set('data', bk.data);
  if (bk.imgs) await Store.set('imgs', bk.imgs); else await Store.del('imgs');
  await Store.del('autoKey'); // النسخة المستعادة تُفتح بالرمز السري
  await Store.del('sync'); Sync.st = null; // النسخة المستعادة لها مفتاح مختلف عن المتجر السحابي
  Vault.meta = meta; await Vault.setRaw(unlocked.raw);
  setDB(migrate(await Vault.read())); await Imgs.load();
}

/* إشعار التحديث: النسخة الأحدث تصل من إعدادات الخادم (latest) */
function verGt(a, b) { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; }
function updateInfo() {
  const l = Cloud.cfg && Cloud.cfg.latest; if (!l || !l.v || !verGt(l.v, APP.version)) return null;
  if (FW_CHANNEL === 'play') return null; // Google Play يحدّث التطبيق بنفسه
  if (FW_CHANNEL === 'direct' && !/^https:\/\//.test(l.apk || '')) return null;
  return { v: String(l.v).slice(0, 12), notes: String(l.notes || '').slice(0, 140), apk: l.apk };
}
ACT.appUpdate = async () => {

};

function initDraft(p) {
  const S = DB.settings;
  if (p.id) {
    const inv = invById(p.id); const paid = paidOf(inv);
    return {
      key: p.id, id: inv.id, type: inv.type, no: inv.no, date: inv.date, partyId: inv.partyId, partyName: inv.partyName || '', partyPhone: inv.partyPhone || '',
      mode: isWhole(inv) ? 'whole' : 'retail',
      lines: inv.lines.map(l => ({ ...l })), discount: inv.discount || 0, note: inv.note || '', vatRate: num(inv.vatRate), vatInclusive: !!inv.vatInclusive,
      payMode: paid >= inv.total - 0.0005 ? 'full' : paid > 0 ? 'partial' : 'credit', payAmount: paid, payMethod: inv.method || 'cash', dueDate: inv.dueDate || '', dirty: false
    };
  }
  const party = p.party ? partyById(p.party) : null;
  return {
    key: 'new', type: p.type, mode: 'retail', no: '', date: today(), partyId: party ? party.id : null, partyName: party ? party.name : '', partyPhone: party ? party.phone || '' : '',
    lines: [], discount: 0, note: '', vatRate: S.vatOn && Plan.can('vat') ? num(S.vatRate) : 0, vatInclusive: !!S.vatInclusive,
    payMode: 'full', payAmount: '', payMethod: 'cash', dueDate: '', dirty: false
  };
}
const dWhole = () => !!(Draft && Draft.type === 'sale' && Draft.mode === 'whole');
/* تغيير نوع البيع: يتغيّر سعر الأسطر التي لم يعدّلها التاجر يدوياً، ويُضاف السعر المقترح في الجملة */
function setMode(D, to) {
  const was = D.mode === 'whole', w = to === 'whole';
  D.mode = to;
  D.lines.forEach(l => {
    const it = l.itemId && itemById(l.itemId);
    if (it && round(l.price) === round(itemPrice(it, 'sale', was))) l.price = itemPrice(it, 'sale', w);
    if (w) { if (l.sug == null || l.sug === '') l.sug = it ? num(it.sale) : ''; } else delete l.sug;
  });
}
function draftCalc() { return calcInvoice({ lines: Draft.lines, discount: Draft.discount, vatRate: Draft.vatRate, vatInclusive: Draft.vatInclusive }); }

  if (!Draft.lines.length) return `<div class="card">${emptyBox('box', 'لم تُضف أصنافاً بعد')}</div>`;
  const sm = stockMap();
  return Draft.lines.map((l, i) => {
    const it = itemById(l.itemId), tracked = it && it.track !== false;
    let hint = '';

/* العملاء/الموردون مرتبين حسب آخر تعامل */
function partiesByRecent(kind) {
  const last = {}; for (const v of DB.invoices) if (v.partyId) last[v.partyId] = Math.max(last[v.partyId] || 0, v.created || 0);
  return DB.parties.filter(x => x.kind === kind).sort((a, b) => (last[b.id] || b.created || 0) - (last[a.id] || a.created || 0));
}
function partyOpt(x) {
  const bal = partyBalance(x);
  return `<button type="button" data-pid="${x.id}"><span class="grow"><span class="b">${esc(x.name)}</span>${x.phone ? ` <span class="muted small ltr">${esc(x.phone)}</span>` : ''}</span>${bal > 0 ? `<span class="small" style="color:var(--danger)">${money(bal)}</span>` : ''}</button>`;
}
/* نافذة اختيار العميل/المورد من القائمة كاملة مع البحث — تعيد null للبيع النقدي، و undefined عند الإغلاق */
function pickParty(kind) {
  const all = partiesByRecent(kind), cust = kind === 'customer';
  return Modal.open(`<div class="search">${ic('search')}<input id="ppQ" placeholder="ابحث بالاسم أو الهاتف" autocomplete="off"></div>
    ${cust ? `<div class="list"><button class="row" data-cash="1"><div class="ico">${ic('cash')}</div><div class="grow"><div class="t">عميل نقدي</div><div class="s">بدون اسم</div></div></button></div>` : ''}<div id="ppList"></div>`, {

      const draw = () => {

        list.innerHTML = m.length ? `<div class="list">${m.map(x => { const bal = partyBalance(x); return `<button class="row" data-pid="${x.id}"><div class="ico">${ic('user')}</div><div class="grow"><div class="t" translate="no">${esc(x.name)}</div><div class="s ltr" style="text-align:start">${esc(x.phone || '')}</div></div>${bal > 0 ? `<div class="end"><div class="amt" style="color:var(--danger)">${money(bal)}</div><div class="small muted">${cust ? 'عليه' : 'له'}</div></div>` : ''}</button>`; }).join('')}</div>`
          : `<div class="card">${emptyBox('users', all.length ? 'لا توجد نتائج' : (cust ? 'لا يوجد عملاء بعد — اكتب اسم العميل في الفاتورة ليُضاف تلقائياً' : 'لا يوجد موردون بعد'))}</div>`;
      };
      liveInput(q, draw, 120); draw();
      if (all.length > 10) setTimeout(() => q.focus(), 280);
      el.addEventListener('click', e => { if (e.target.closest('[data-cash]')) return Modal.close(null); const b = e.target.closest('[data-pid]'); if (b) Modal.close(partyById(b.dataset.pid)); });
    }
  });
}
/* قائمة اختيار الأصناف: يختار التاجر عدة أصناف وكمياتها ثم يضيفها مرة واحدة */
function pickItems(opts = {}) {
  const lab = !!opts.labels; // اختيار أصناف لطباعة ملصقاتها (الكمية = عدد الملصقات)
  const type = lab ? 'sale' : Draft.type, sale = type === 'sale', sm = stockMap(), sel = new Map(), st = { changed: false };
  const inInv = {}; if (!lab) Draft.lines.forEach(l => { if (l.itemId) inInv[l.itemId] = round((inInv[l.itemId] || 0) + num(l.qty), 3); });
  const use = {}; DB.invoices.slice(-300).forEach(v => { if (v.type === type && !v.void) v.lines.forEach(l => { if (l.itemId) use[l.itemId] = (use[l.itemId] || 0) + 1; }); });
  const priceOf = i => lab ? num(i.sale) : itemPrice(i, type, dWhole());
  const commit = () => { if (lab) return 0; let n = 0; for (const [id, q] of sel) { const it = itemById(id); if (it && q > 0) { addLine(it, q, true); n++; } } sel.clear(); if (n) st.changed = true; return n; };
  return Modal.open(`<div class="search">${ic('search')}<input id="pkQ" placeholder="${lab ? 'ابحث عن صنف' : 'ابحث أو اكتب اسم صنف جديد'}" autocomplete="off"></div><div id="pkList"></div>
    <div class="pk-bar hide" id="pkBar"><button class="btn ${sale ? 'sale' : 'pur'}" id="pkGo"></button></div>`, {
    title: lab ? 'اختر أصناف الملصقات' : 'اختر الأصناف', cls: 'tall', onMount(el) {
      const q = $('#pkQ', el), list = $('#pkList', el), bar = $('#pkBar', el), go = $('#pkGo', el);
      const rowHtml = i => {
        const n = sel.get(i.id) || 0, tr = i.track !== false, avail = sm[i.id], out = !lab && sale && tr && avail <= 0;
        const sub = [`<span class="amt">${money(priceOf(i))}</span>`];
        sub.push(tr ? (out ? '<span style="color:var(--danger)">نفد من المخزون</span>' : 'المتوفر ' + qtyFmt(avail) + ' ' + esc(i.unit || '')) : 'خدمة');
        if (inInv[i.id]) sub.push(`<span class="pk-in">في الفاتورة: ${qtyFmt(inInv[i.id])}</span>`);
        return `<div class="row pk ${n ? 'sel' : ''} ${out ? 'out' : ''}" data-id="${i.id}" role="button" tabindex="0">${thumb(i)}<div class="grow"><div class="t" translate="no">${esc(i.name)}</div><div class="s">${sub.join(' · ')}</div></div>
          <div class="pk-q">${n ? `<button type="button" data-d="-1" aria-label="إنقاص">${ic('minus')}</button><b class="num">${qtyFmt(n)}</b><button type="button" data-d="1" aria-label="زيادة">${ic('plus')}</button>` : `<button type="button" class="pk-add" data-d="1" aria-label="إضافة">${ic('plus')}</button>`}</div></div>`;
      };
      const upBar = () => {
        let cnt = 0, tot = 0; for (const [id, n] of sel) { const it = itemById(id); if (it && n > 0) { cnt++; tot += n * priceOf(it); } }
        bar.classList.toggle('hide', !cnt);
        if (lab) { let q = 0; for (const n of sel.values()) q += Math.max(1, Math.round(n)); go.innerHTML = `${ic('print')} طباعة ${lblN(q)}`; return; }
        go.innerHTML = `${ic('check')} إضافة ${cnt === 1 ? 'صنف واحد' : cnt === 2 ? 'صنفين' : cnt + ' أصناف'} إلى الفاتورة <span class="pk-tot num">${money(tot)}</span>`;
      };
      const draw = () => {
        const raw = q.value.trim(), s = normAr(raw), all = activeItems();
        let items = all.filter(i => itemMatch(i, s));
        items.sort((a, b) => (s ? (normAr(b.name).startsWith(s) - normAr(a.name).startsWith(s)) : 0) || (use[b.id] || 0) - (use[a.id] || 0) || a.name.localeCompare(b.name, 'ar'));
        const more = items.length > 150; items = items.slice(0, 150);
        let h = '';
        if (raw && !lab && !itemByBarcode(raw) && !all.some(i => normAr(i.name) === s)) h += `<div class="list"><button class="row" data-new="1"><div class="ico">${ic('plus')}</div><div class="grow"><div class="t">إضافة «${esc(raw)}» كصنف جديد</div></div></button></div>`;
        if (items.length) h += `${!raw && all.length > 1 ? `<div class="small muted pk-hint">${lab ? 'اضغط على الصنف لاختياره، ومرة أخرى لزيادة عدد ملصقاته' : 'اضغط على الصنف لإضافته، واضغط مرة أخرى لزيادة الكمية'}</div>` : ''}<div class="list">${items.map(rowHtml).join('')}</div>`;
        if (more) h += '<div class="center small muted" style="margin-bottom:10px">اكتب في البحث لعرض باقي الأصناف</div>';
        list.innerHTML = h || `<div class="card">${emptyBox('box', 'لا توجد أصناف بعد<br>اكتب اسم الصنف في خانة البحث لإضافته')}</div>`;
      };
      const bump = (id, d) => {
        const it = itemById(id); if (!it) return;
        const n = Math.max(0, round((sel.get(id) || 0) + d, 3));
        if (n) sel.set(id, n); else sel.delete(id);
        const r = list.querySelector(`.row.pk[data-id="${id}"]`); if (r) r.outerHTML = rowHtml(it);
        upBar(); if (navigator.vibrate && d > 0) navigator.vibrate(8);
      };
      /* قارئ الباركود (بلوتوث أو USB) يكتب الرقم ثم Enter: يُضاف الصنف مباشرة */
      const scan = () => { const it = itemByBarcode(q.value); if (!it) return false; q.value = ''; draw(); bump(it.id, 1); toast('«' + it.name + '» ✓', 1200); return true; };
      liveInput(q, () => { if (isEan13(normBarcode(q.value)) && scan()) return; draw(); }, 120); draw(); upBar();
      q.addEventListener('keydown', e => { if (e.key === 'Enter' && scan()) e.preventDefault(); });

function addLine(it, qty = 1, quiet) {

async function saveDraft() {
  const D = Draft;
  if (!D.lines.length) return toast('أضف صنفاً واحداً على الأقل');
  if (D.lines.some(l => num(l.qty) <= 0)) return toast('تأكد من كميات الأصناف');
  const name = D.partyName.trim(), phone = D.partyPhone.trim();
  if (D.payMode !== 'full' && !name) { toast(`اكتب اسم ${D.type === 'sale' ? 'العميل' : 'المورد'} لتسجيل الدين عليه`); $('#edParty').focus(); return; }
  if (D.payMode === 'partial' && !(num(D.payAmount) > 0)) { toast('اكتب المبلغ المدفوع'); $('#edPaid').focus(); return; }
  const isNew = !D.id;
  if (isNew && limitBlocked()) return startInvoice(D.type);
  // ربط العميل/المورد أو إنشاؤه
  const kind = D.type === 'sale' ? 'customer' : 'supplier';
  let pid = null;
  if (name) {
    let p = D.partyId ? partyById(D.partyId) : null;
    if (!p || p.name.trim() !== name) p = DB.parties.find(x => x.kind === kind && x.name.trim() === name);
    if (!p) { p = { id: uid(), kind, name, phone, note: '', created: Date.now() }; DB.parties.push(p); }
    else if (phone && p.phone !== phone) p.phone = phone;
    pid = p.id;
  }
  if (isNew && !Me.name && !Me.asked) await askMyName();
  const inv = isNew ? { id: uid(), type: D.type, no: nextNo(D.type), created: Date.now(), payments: [] } : invById(D.id);
  if (isNew && Me.name) inv.by = Me.name;
  Object.assign(inv, {
    date: D.date, partyId: pid, partyName: name, partyPhone: phone,
    lines: D.lines.map(l => { const o = { itemId: l.itemId, name: l.name, unit: l.unit || '', qty: round(num(l.qty), 3), price: round(l.price) }; const en = l.nameEn || lineNameEn(l); if (en) o.nameEn = en; if (dWhole() && num(l.sug) > 0) o.sug = round(l.sug); return o; }),
    discount: round(D.discount), vatRate: D.vatRate, vatInclusive: D.vatInclusive, note: D.note.trim(), method: D.payMethod, updated: Date.now()
  });
  if (dWhole()) inv.mode = 'whole'; else delete inv.mode;
  if (inv.type === 'sale' && D.payMode !== 'full') inv.dueDate = D.dueDate || ($('#edDue') && $('#edDue').value) || addDays(D.date, num(Remind.cfg().terms)); else delete inv.dueDate;
  const c = calcInvoice(inv); inv.subtotal = c.sub; inv.vat = c.vat; inv.total = c.total;
  const paid = D.payMode === 'full' ? c.total : D.payMode === 'credit' ? 0 : Math.min(round(D.payAmount), c.total);
  if (isNew || round(paid) !== paidOf(inv)) inv.payments = paid > 0 ? [{ d: D.date, a: round(paid), m: D.payMethod }] : [];
  inv.paid = paidOf(inv);
  if (isNew) DB.invoices.push(inv);
  if (inv.type === 'purchase') for (const l of inv.lines) { const it = itemById(l.itemId); if (it && num(l.price) > 0) it.cost = l.price; }
  await persist(); Remind.schedule();
  Cloud.ev(isNew ? 'inv_new' : 'inv_edit', { t: inv.type === 'sale' ? (isWhole(inv) ? 'w' : 's') : 'p', n: DB.invoices.length, l: inv.lines.length, pm: D.payMode[0] });
  Draft = null;
  Nav.replace('invoice', { id: inv.id });
  toast(isNew ? 'تم حفظ الفاتورة ✓' : 'تم حفظ التعديلات ✓');
}

const PRINTER_RX = /print|xp-|xprinter|pos|label|thermal|hprt|tsc|gp-|gprinter|zj|mtp|ptp|rpp|bixolon|sunmi|zebra|munbyn|rongta|jolimark|hprt|hm-|qr-|peripage|phomemo|niimbot|طابعة/i;
async function choosePrinter(kind = 'label') {
  if (!Printer.avail()) { await alertDlg('اختيار الطابعة متاح في تطبيق أندرويد فقط.'); return null; }
  let devs;
  try { devs = await Printer.list(); }
  catch (e) { await alertDlg(Printer.err(e)); return null; }
  devs.sort((a, b) => (PRINTER_RX.test(b.name) || b.cls === 1536) - (PRINTER_RX.test(a.name) || a.cls === 1536) || String(a.name).localeCompare(String(b.name)));
  const cur = ((kind === 'receipt' ? Printers.receipt : labelCfg().dev) || {}).address;
  const d = await Modal.open(devs.length ? `<p class="muted small" style="margin-top:0">الأجهزة المقترنة مع جوالك. إذا لم تجد طابعتك، اقرنها أولاً من إعدادات البلوتوث في الجوال (الرمز غالباً 0000 أو 1234).</p>
      <div class="list">${devs.map((x, i) => `<button class="row" data-i="${i}"><div class="ico">${ic(PRINTER_RX.test(x.name) || x.cls === 1536 ? 'print' : 'bt')}</div><div class="grow"><div class="t ltr" style="text-align:start">${esc(x.name)}</div><div class="s ltr" style="text-align:start">${esc(x.address)}</div></div>${x.address === cur ? ic('check') : ''}</button>`).join('')}</div>`
    : `<div class="center">${ic('bt')}<p>لا توجد أجهزة بلوتوث مقترنة.</p><p class="muted small">شغّل الطابعة، ثم افتح إعدادات البلوتوث في جوالك واقرنها (الرمز غالباً 0000 أو 1234)، ثم ارجع هنا.</p></div><button class="btn" data-close>حسناً</button>`, {
    title: 'اختر الطابعة', onMount(el) { el.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) Modal.close(devs[+b.dataset.i]); }); }
  });
  if (!d || !d.address) return null;
  await Printers.set(kind, d); Cloud.ev('printer_set', { k: kind[0] }); toast('تم اختيار الطابعة ' + d.name + ' ✓');
  return d;
}

async function autoOpenToggle(e) {
  const on = e.target.checked; e.target.checked = !on;
  if (on) {
    if (!(await confirmDlg('سيُفتح التطبيق دون طلب الرمز السري، وأي شخص يمسك جوالك يستطيع رؤية فواتيرك وبيانات عملائك.<br><span class="small muted">يبقى الرمز السري مطلوباً لإلغاء الفواتير وتغيير إعدادات الحماية ومسح البيانات.</span>', { ok: 'فتح بدون رمز', cancel: 'إلغاء' }))) return;
    if (!(await askPin('أدخل الرمز السري للتأكيد'))) return;
    await Vault.enableAuto(); Cloud.ev('auto_open', { on: 1 }); toast('سيُفتح التطبيق بدون رمز سري ✓');
  } else { await Vault.disableAuto(); Cloud.ev('auto_open', { on: 0 }); toast('سيطلب التطبيق الرمز السري عند فتحه ✓'); }
  const y = scrollY; render(); scrollTo(0, y);
}

/* ---------- الاشتراك والباقات ---------- */
function planPrice(id, per = UI.planPer) {
  const P = PLANS[id]; if (!P.price) return 'مجاناً';
  if (FW_CHANNEL === 'play') {
    const pr = Billing.prod(id, per);
    if (pr && pr.price) return esc(pr.price) + ' / ' + PERIOD_TXT[per];
    return '$' + (per === 'y' ? P.usdY : P.usd) + ' / ' + PERIOD_TXT[per];
  }
  return `${(per === 'y' ? P.priceY : P.price).toFixed(3)} ر.ع. / ${PERIOD_TXT[per]}`;
}
function planSave(id) {
  const m = Billing.prod(id, 'm'), y = Billing.prod(id, 'y');
  if (FW_CHANNEL === 'play' && m && y && m.num && y.num) return Math.round((1 - y.num / (m.num * 12)) * 100);
  const P = PLANS[id]; return FW_CHANNEL === 'play' ? Math.round((1 - P.usdY / (P.usd * 12)) * 100) : yearSave(id);
}
function planTrial(id) { const pr = FW_CHANNEL === 'play' && UI.planPer === 'm' ? Billing.prod(id, 'm') : null; return pr && pr.trial ? pr.trial.days : 0; }
function planCard(id) {
  const P = PLANS[id], cur = Plan.id === id, best = id === 'advanced', per = UI.planPer, trial = planTrial(id);
  const feats = id === 'free' ? [...BASE_FEATS.map(t => [t, 1]), [`حتى ${P.limit} فاتورة شهرياً`, 1], ['تظهر إعلانات', 0]]
    : [...(id === 'advanced' ? [['كل مزايا الباقة الأساسية', 1]] : [['كل مزايا الباقة المجانية', 1]]), ...P.feats.filter(f => id === 'basic' || !PLANS.basic.feats.includes(f)).map(f => [FEAT_TXT[f], 1])];
  let btn = '';
  if (cur) btn = `<div class="plan-cur">${ic('check')} باقتك الحالية${Plan.src ? ' — ' + Plan.srcTxt() : ''}</div>`;
  else if (id !== 'free' && PLAN_RANK[id] > PLAN_RANK[Plan.id]) btn = `<button class="btn ${best ? '' : 'sec'}" data-act="subscribe" data-plan="${id}">${FW_CHANNEL === 'play' ? (trial ? `ابدأ التجربة المجانية ${trial} أيام` : 'اشترك الآن') : `${ic('wa')} اشترك عبر واتساب`}</button>
    ${trial ? `<div class="small muted center" style="margin-top:6px">بعد التجربة ${planPrice(id)} — ألغِ قبل انتهائها ولن تدفع شيئاً</div>` : ''}`;
  const sv = id !== 'free' && per === 'y' ? planSave(id) : 0;
  return `<div class="plan ${best ? 'best' : ''} ${cur ? 'cur' : ''}" id="plan-${id}">${best ? '<span class="plan-tag">الأكثر فائدة</span>' : ''}
    <div class="plan-h"><b>الباقة ${P.name}</b><span class="plan-p">${planPrice(id)}${sv > 0 ? ` <span class="badge save">وفّر ${sv}%</span>` : ''}${trial ? ` <span class="badge save">${trial} أيام مجاناً</span>` : ''}</span></div>
    <ul>${feats.map(([t, ok]) => `<li class="${ok ? '' : 'no'}">${ic(ok ? 'check' : 'x')} ${esc(t)}</li>`).join('')}</ul>${btn}</div>`;
}
