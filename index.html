async function saveDraft() {
  const D = Draft;
  if (!D.lines.length) return toast('أضف صنفاً واحداً على الأقل');
  if (D.lines.some(l => num(l.qty) <= 0)) return toast('تأكد من كميات الأصناف');
  const name = D.partyName.trim(), phone = D.partyPhone.trim();
  if (D.payMode !== 'full' && !name) { toast(`اكتب اسم ${D.type === 'sale' ? 'العميل' : 'المورد'} لتسجيل الدين عليه`); $('#edParty').focus(); return; }
  if (D.payMode === 'partial' && !(num(D.payAmount) > 0)) { toast('اكتب المبلغ المدفوع'); $('#edPaid').focus(); return; }
  const isNew = !D.id;
  if (isNew && limitBlocked()) return startInvoice(D.type);
  // ربط العميل/المورد أو إنشاؤه
  const kind = D.type === 'sale' ? 'customer' : 'supplier';
  let pid = null;
  if (name) {
    let p = D.partyId ? partyById(D.partyId) : null;
    if (!p || p.name.trim() !== name) p = DB.parties.find(x => x.kind === kind && x.name.trim() === name);
    if (!p) { p = { id: uid(), kind, name, phone, note: '', created: Date.now() }; DB.parties.push(p); }
    else if (phone && p.phone !== phone) p.phone = phone;
    pid = p.id;
  }
  const inv = isNew ? { id: uid(), type: D.type, no: nextNo(D.type), created: Date.now(), payments: [] } : invById(D.id);
  Object.assign(inv, {
    date: D.date, partyId: pid, partyName: name, partyPhone: phone,
    lines: D.lines.map(l => { const o = { itemId: l.itemId, name: l.name, unit: l.unit || '', qty: round(num(l.qty), 3), price: round(l.price) }; const en = l.nameEn || lineNameEn(l); if (en) o.nameEn = en; if (dWhole() && num(l.sug) > 0) o.sug = round(l.sug); return o; }),
    discount: round(D.discount), vatRate: D.vatRate, vatInclusive: D.vatInclusive, note: D.note.trim(), method: D.payMethod, updated: Date.now()
  });
  if (dWhole()) inv.mode = 'whole'; else delete inv.mode;
  const c = calcInvoice(inv); inv.subtotal = c.sub; inv.vat = c.vat; inv.total = c.total;
  const paid = D.payMode === 'full' ? c.total : D.payMode === 'credit' ? 0 : Math.min(round(D.payAmount), c.total);
  if (isNew || round(paid) !== paidOf(inv)) inv.payments = paid > 0 ? [{ d: D.date, a: round(paid), m: D.payMethod }] : [];
  inv.paid = paidOf(inv);
  if (isNew) DB.invoices.push(inv);
  if (inv.type === 'purchase') for (const l of inv.lines) { const it = itemById(l.itemId); if (it && num(l.price) > 0) it.cost = l.price; }
  await persist();
  Cloud.ev(isNew ? 'inv_new' : 'inv_edit', { t: inv.type === 'sale' ? (isWhole(inv) ? 'w' : 's') : 'p', n: DB.invoices.length, l: inv.lines.length, pm: D.payMode[0] });
  Draft = null;
  Nav.replace('invoice', { id: inv.id });
  toast(isNew ? 'تم حفظ الفاتورة ✓' : 'تم حفظ التعديلات ✓');
}

const PRINTER_RX = /print|xp-|xprinter|pos|label|thermal|hprt|tsc|gp-|gprinter|zj|mtp|ptp|rpp|bixolon|sunmi|zebra|munbyn|rongta|jolimark|hprt|hm-|qr-|peripage|phomemo|niimbot|طابعة/i;

  const d = await Modal.open(devs.length ? `<p class="muted small" style="margin-top:0">الأجهزة المقترنة مع جوالك. إذا لم تجد طابعتك، اقرنها أولاً من إعدادات البلوتوث في الجوال (الرمز غالباً 0000 أو 1234).</p>

function planPrice(id, per = UI.planPer) {
  const P = PLANS[id]; if (!P.price) return 'مجاناً';
  if (FW_CHANNEL === 'play') {
    const pr = Billing.prod(id, per);
    if (pr && pr.price) return esc(pr.price) + ' / ' + PERIOD_TXT[per];
    return '$' + (per === 'y' ? P.usdY : P.usd) + ' / ' + PERIOD_TXT[per];
  }
  return `${(per === 'y' ? P.priceY : P.price).toFixed(3)} ر.ع. / ${PERIOD_TXT[per]}`;
}
function planSave(id) {
  const m = Billing.prod(id, 'm'), y = Billing.prod(id, 'y');
  if (FW_CHANNEL === 'play' && m && y && m.num && y.num) return Math.round((1 - y.num / (m.num * 12)) * 100);
  const P = PLANS[id]; return FW_CHANNEL === 'play' ? Math.round((1 - P.usdY / (P.usd * 12)) * 100) : yearSave(id);
}
function planTrial(id) { const pr = FW_CHANNEL === 'play' && UI.planPer === 'm' ? Billing.prod(id, 'm') : null; return pr && pr.trial ? pr.trial.days : 0; }
function planCard(id) {
  const P = PLANS[id], cur = Plan.id === id, best = id === 'advanced', per = UI.planPer, trial = planTrial(id);
  const feats = id === 'free' ? [...BASE_FEATS.map(t => [t, 1]), [`حتى ${P.limit} فاتورة شهرياً`, 1], ['تظهر إعلانات', 0]]
    : [...(id === 'advanced' ? [['كل مزايا الباقة الأساسية', 1]] : [['كل مزايا الباقة المجانية', 1]]), ...P.feats.filter(f => id === 'basic' || !PLANS.basic.feats.includes(f)).map(f => [FEAT_TXT[f], 1])];
  let btn = '';
  if (cur) btn = `<div class="plan-cur">${ic('check')} باقتك الحالية${Plan.src ? ' — ' + Plan.srcTxt() : ''}</div>`;
  else if (id !== 'free' && PLAN_RANK[id] > PLAN_RANK[Plan.id]) btn = `<button class="btn ${best ? '' : 'sec'}" data-act="subscribe" data-plan="${id}">${FW_CHANNEL === 'play' ? (trial ? `ابدأ التجربة المجانية ${trial} أيام` : 'اشترك الآن') : `${ic('wa')} اشترك عبر واتساب`}</button>
    ${trial ? `<div class="small muted center" style="margin-top:6px">بعد التجربة ${planPrice(id)} — ألغِ قبل انتهائها ولن تدفع شيئاً</div>` : ''}`;
  const sv = id !== 'free' && per === 'y' ? planSave(id) : 0;
  return `<div class="plan ${best ? 'best' : ''} ${cur ? 'cur' : ''}" id="plan-${id}">${best ? '<span class="plan-tag">الأكثر فائدة</span>' : ''}
    <div class="plan-h"><b>الباقة ${P.name}</b><span class="plan-p">${planPrice(id)}${sv > 0 ? ` <span class="badge save">وفّر ${sv}%</span>` : ''}${trial ? ` <span class="badge save">${trial} أيام مجاناً</span>` : ''}</span></div>
    <ul>${feats.map(([t, ok]) => `<li class="${ok ? '' : 'no'}">${ic(ok ? 'check' : 'x')} ${esc(t)}</li>`).join('')}</ul>${btn}</div>`;
}

ACT.playRestore = async () => { await Billing.restore(); render(); toast(Plan.src === 'play' ? 'تمت استعادة اشتراكك ✓' : 'لا يوجد اشتراك فعّال على حساب Google هذا'); };
ACT.playManage = () => Billing.manage();
ACT.privacy = () => openExternal(APP.privacyUrl);
Screens.about = {
  noTabs: true, title: 'حول التطبيق',
  render: () => `<div class="card center"><img src="${APP_ICON}" style="width:84px;height:84px;border-radius:22px"><h3 style="font-size:22px;margin:10px 0 0">${APP.name}</h3><div class="muted">الإصدار ${APP.version}</div></div>
    <div class="card" style="font-size:16px"><div class="stack">
      <div>${ic('check')} فواتير بيع وشراء مع متابعة المخزون</div><div>${ic('check')} متابعة ديون العملاء والموردين</div>
      <div>${ic('check')} مشاركة الفواتير صورة أو PDF عبر واتساب</div><div>${ic('check')} تقارير المبيعات والأرباح والضريبة</div>
      <div>${ic('check')} تشفير كامل للبيانات وحماية برمز سري</div><div>${ic('check')} يعمل بدون إنترنت</div></div></div>
    <div class="card small muted">الخصوصية: فواتيرك وأسماء عملائك وأرقامهم محفوظة ومشفّرة على جهازك فقط ولا تُرسل لأي خادم. يرسل التطبيق إحصائيات استخدام مجهولة (أعداد فقط) لتحسينه، ويمكنك إيقافها من «الحماية».
      <br><button class="link" data-act="privacy" style="margin-top:6px">سياسة الخصوصية</button></div>
    ${creditsHtml(true)}`
};

/* =====================================================================
   التشغيل
   ===================================================================== */
async function boot() {
  const m = /[#&]act=([^&]+)/.exec(location.hash); if (m) { PendingActivation = decodeURIComponent(m[1]); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } }
  if (!window.crypto || !crypto.subtle) {
    document.body.innerHTML = '<div class="onb center"><h2>تعذّر التشغيل</h2><p class="sub">يجب فتح التطبيق عبر رابط آمن (https) أو من التطبيق المثبّت.</p></div>';
    return;
  }
  await Store.open();
  await License.init();
  await Plan.init();
  await Cloud.init();
  await Billing.init(); Plan.compute();
  await Vault.load();
  setupBackTrap(); Lock.init();
  if (Store.mode === 'mem') toast('تنبيه: المتصفح لا يسمح بحفظ البيانات في هذا الوضع', 5000);
  if (!Vault.ready()) { Nav.stack = [{ name: 'welcome', params: {} }]; render(); }
  else {
    const raw = Vault.auto() ? await Vault.tryAuto() : null;
    if (raw) { await Vault.unlockWith(raw); await afterUnlock(); creditsSplash(); }
    else { Lock.on = true; showLockScreen(); }
  }
  try {
    if ('serviceWorker' in navigator && location.protocol === 'https:' && !isNative() && window.top === window && document.querySelector('link[rel=manifest]')) navigator.serviceWorker.register('sw.js').catch(() => { });
  } catch (e) { }
  const sp = document.getElementById('splash'); if (sp) sp.remove();
  setTimeout(() => Cloud.sync(true), 1500);
}
boot();

'use strict';
/* =====================================================================
   الجولة التعريفية: بالونات شفافة تشرح أساسيات التطبيق عند أول استخدام
   ===================================================================== */
const TOURS = {
  home: [
    { sel: '.big-act.sale', t: 'فاتورة بيع', d: 'من هنا تصدر فاتورة بيع لعميلك، ثم ترسلها له على واتساب بضغطة.' },
    { sel: '.big-act.pur', t: 'فاتورة شراء', d: 'سجّل ما تشتريه من الموردين، فيزيد مخزونك تلقائياً.' },
    { sel: '.stats', t: 'ملخص يومك', d: 'مبيعات ومشتريات اليوم، وديونك عند العملاء وما عليك للموردين.' },
    { sel: '#tabbar [data-tab=items]', t: 'الأصناف', d: 'أضف منتجاتك وأسعارها مرة واحدة لتختارها بسرعة في الفواتير.' },
    { sel: '#tabbar [data-tab=parties]', t: 'العملاء والموردون', d: 'تابع ديون كل عميل وسجّل دفعاته.' },
    { sel: '#tabbar [data-tab=more]', t: 'المزيد', d: 'الإعدادات والنسخ الاحتياطي والاشتراك في الباقات.' },
    { sel: '#topbar [data-act=lockNow]', t: 'قفل سريع', d: 'اقفل التطبيق بضغطة عندما تترك جوالك.' }
  ],
  editor: [
    { sel: '#edParty', t: 'اسم العميل', d: 'اكتب اسم العميل، أو اتركه فارغاً للبيع النقدي.' },
    { sel: '#edMode', t: 'مفرد أو جملة', d: 'اختر «بيع بالجملة» لتظهر أسعار الجملة، ومعها السعر المقترح لبيع كل صنف بالمفرد.' },
    { sel: '#edAdd', t: 'اختيار الأصناف', d: 'تفتح قائمة أصنافك بصورها: اضغط على كل صنف تريده (مرتين لزيادة الكمية)، ثم «إضافة إلى الفاتورة».' },
    { sel: '#edPay', t: 'حالة الدفع', d: 'مدفوعة كاملة، أو آجلة (دَين)، أو دفع جزئي.' },
    { sel: '#edSave', t: 'حفظ الفاتورة', d: 'بعد الحفظ تظهر الفاتورة جاهزة للإرسال والطباعة.' }
  ],
  invoice: [
    { sel: '#ivShare', t: 'أرسل الفاتورة', d: 'أرسلها صورة لعميلك عبر واتساب أو أي تطبيق آخر.' },
    { sel: '#ivImg', t: 'معاينة الفاتورة', d: 'هكذا تظهر فاتورتك لعميلك. يمكنك تعديل بيانات محلك من «المزيد».' }
  ],
  items: [
    { sel: '#view .btn[data-to=item]', t: 'صنف جديد', d: 'أضف اسم الصنف وسعر البيع والكمية المتوفرة، وصورة صغيرة له إن أردت.' }
  ]
};
const Tour = {
  active: false, el: null,
  maybe(name, force) {
    if (!TOURS[name] || !DB || this.active) return;
    DB.tours = DB.tours || {};
    if (DB.tours[name] && !force) return;
    setTimeout(() => {
      if (this.active || Lock.on || !DB) return;
      if (!force && (Modal.stack.length || Nav.cur().name !== name)) return;
      this.run(name);
    }, force ? 200 : 650);
  },
  run(name) {
    const steps = TOURS[name].filter(s => document.querySelector(s.sel));
    if (!steps.length) return;
    this.active = true; let i = 0;
    const root = document.createElement('div'); root.id = 'tour';
    root.innerHTML = '<div class="tr-spot"></div><div class="tr-bub" role="dialog" aria-live="polite"><div class="tr-tail"></div><div class="tr-in"></div></div>';
    document.body.appendChild(root); this.el = root;
    const spot = $('.tr-spot', root), bub = $('.tr-bub', root), tail = $('.tr-tail', root), inner = $('.tr-in', root);
    const finish = skipped => {
      this.active = false; root.classList.add('out'); setTimeout(() => root.remove(), 220);
      removeEventListener('resize', place);
      DB.tours = DB.tours || {}; DB.tours[name] = 1; persist();
      Cloud.ev('tour', { k: name, s: skipped ? i + 1 : 0 });
    };
    const place = () => {
      const s = steps[i], t = document.querySelector(s.sel); if (!t) return;
      const r = t.getBoundingClientRect(), pad = 6;
      Object.assign(spot.style, { top: (r.top - pad) + 'px', left: (r.left - pad) + 'px', width: (r.width + pad * 2) + 'px', height: (r.height + pad * 2) + 'px' });
      const vw = innerWidth, vh = innerHeight, bw = Math.min(330, vw - 24);
      bub.style.width = bw + 'px';
      const bh = bub.offsetHeight || 150;
      const below = r.bottom + 14 + bh < vh - 8 || r.top - 14 - bh < 8;
      const top = below ? Math.min(r.bottom + 14, vh - bh - 8) : Math.max(8, r.top - 14 - bh);
      const cx = r.left + r.width / 2, left = Math.max(12, Math.min(vw - bw - 12, cx - bw / 2));
      Object.assign(bub.style, { top: top + 'px', left: left + 'px' });
      bub.classList.toggle('up', !below);
      tail.style.left = Math.max(18, Math.min(bw - 18, cx - left)) + 'px';
    };
    const show = () => {
      const s = steps[i], t = document.querySelector(s.sel);
      if (t && t.scrollIntoView && !t.closest('#tabbar,#topbar')) t.scrollIntoView({ block: 'center', behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
      const last = i === steps.length - 1;
      inner.innerHTML = `<div class="tr-step">${i + 1} من ${steps.length}</div><div class="tr-t">${esc(s.t)}</div><div class="tr-d">${esc(s.d)}</div>
        <div class="tr-btns"><button type="button" class="tr-next">${last ? 'فهمت 👍' : 'التالي'}</button>${last ? '' : '<button type="button" class="tr-skip">تخطي</button>'}</div>`;
      bub.classList.remove('pop'); void bub.offsetWidth; bub.classList.add('pop');
      requestAnimationFrame(place);
    };
    root.addEventListener('click', e => {
      if (e.target.closest('.tr-skip')) return finish(true);
      if (e.target.closest('.tr-next') || e.target === root || e.target.classList.contains('tr-spot')) { if (i < steps.length - 1) { i++; show(); } else finish(false); }
    });
    addEventListener('resize', place);
    show();
  }
};
ACT.replayTour = () => { Nav.tab('home'); Tour.maybe('home', true); };

</script>
