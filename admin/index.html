:root{
  color-scheme:light;
  --bg:#f2f2ef; --surface-1:#fcfcfb; --surface-2:#f6f6f3; --line:#e4e3de; --grid:#ecebe6;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#7d7c77;
  --brand:#0F766E; --brand-d:#115E59; --brand-l:#E6F4F1;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
  --good:#0ca30c; --good-ink:#006300; --critical:#d03b3b; --warning:#fab219;
  --seq-100:#cde2fb; --seq-200:#9ec5f4; --seq-300:#6da7ec; --seq-400:#3987e5; --seq-500:#256abf; --seq-600:#184f95; --seq-700:#0d366b;
  --radius:16px; --shadow:0 1px 2px rgba(11,11,11,.05),0 4px 14px rgba(11,11,11,.05);
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark; --bg:#121211; --surface-1:#1a1a19; --surface-2:#222220; --line:#2f2f2c; --grid:#2a2a27;
  --text-primary:#f0efec; --text-secondary:#c3c2b7; --muted:#8f8e86; --brand-l:#123a36;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --good-ink:#5ccf5c;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text-primary);font-size:15px;line-height:1.5;direction:rtl;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,.ltr{direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sec{color:var(--text-secondary)} .small{font-size:13px} .b{font-weight:700}
.hide{display:none!important}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- الدخول ---------- */
.auth{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 80% -10%,var(--brand-l),transparent),var(--bg)}
.auth-card{width:min(420px,100%);background:var(--surface-1);border:1px solid var(--line);border-radius:22px;padding:28px 24px;box-shadow:var(--shadow)}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.auth-brand img{width:46px;height:46px;border-radius:13px}
.auth-brand b{font-size:19px;display:block}
.auth h2{margin:0 0 6px;font-size:21px}
.auth p{margin:0 0 16px;color:var(--text-secondary)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);background:var(--surface-1);border-radius:12px;padding:11px 13px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.fld .hint{font-size:12px;color:var(--muted);margin-top:4px}
.otp{letter-spacing:10px;text-align:center;font-size:26px!important;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--brand);color:#fff;cursor:pointer;min-height:44px}
.btn:hover{background:var(--brand-d)} .btn:disabled{opacity:.55;cursor:default}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--text-secondary)} .btn.ghost:hover{background:var(--surface-2)}
.btn.line{background:var(--surface-1);color:var(--text-primary);border:1.5px solid var(--line)} .btn.line:hover{background:var(--surface-2)}
.btn.danger{background:var(--critical)} .btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:10px}
.err{color:var(--critical);font-size:14px;min-height:20px;margin:4px 0 8px}
.ok-msg{color:var(--good-ink);font-size:14px}
.qr{display:grid;place-items:center;background:#fff;border-radius:14px;padding:12px;margin:10px 0;border:1px solid var(--line)}
.qr img{width:190px;height:190px}
.secret{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--surface-2);border-radius:10px;padding:8px 10px;word-break:break-all;direction:ltr;text-align:center}
.pw-meter{height:6px;border-radius:6px;background:var(--grid);overflow:hidden;margin-top:6px}.pw-meter i{display:block;height:100%;width:0;transition:.2s}
.sec-list{list-style:none;margin:12px 0 0;padding:0;font-size:13px;color:var(--text-secondary)}
.sec-list li{display:flex;gap:8px;align-items:center;padding:3px 0}.sec-list .i{width:16px;height:16px;color:var(--good)}

/* ---------- الهيكل ---------- */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--surface-1);border-left:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .brand img{width:36px;height:36px;border-radius:10px}
.side .brand b{display:block;font-size:16px}.side .brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;width:100%;text-align:right;padding:10px 12px;border-radius:11px;cursor:pointer;color:var(--text-secondary);font-weight:500}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--brand-l);color:var(--brand-d);font-weight:700}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}
.side-foot .who{direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}
.main{min-width:0;padding:22px 28px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:24px;margin:0;flex:1;min-width:180px}
.seg{display:inline-flex;background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 12px;cursor:pointer;color:var(--text-secondary);font-size:14px}
.seg button.on{background:var(--brand);color:#fff;font-weight:700}
.updated{font-size:12px;color:var(--muted)}
.mtabs{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px;border-left:0;border-bottom:1px solid var(--line)}
  .side .brand{padding:4px 6px;width:100%}
  .side .nav{width:auto;padding:8px 10px;font-size:13px}
  .side .nav span{display:none} .side .nav.on span{display:inline}
  .side-foot{margin:0;border:0;padding:0;width:100%;display:flex;gap:8px;align-items:center}
  .side-foot .who{margin:0;flex:1}
  .main{padding:16px 12px 60px}
}

/* ---------- البطاقات ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1200px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-size:15px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h h3{flex:1}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:400;display:block}
.tbtn{border:1px solid var(--line);background:var(--surface-1);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--text-secondary);cursor:pointer}
.mt{margin-top:14px}
.kpi .l{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:30px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
.kpi .v small{font-size:14px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.kpi .d{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;border-radius:999px;padding:1px 7px;font-size:12px}
.delta.up{color:var(--good-ink);background:color-mix(in srgb,var(--good) 12%,transparent)}
.delta.down{color:var(--critical);background:color-mix(in srgb,var(--critical) 12%,transparent)}
.delta.flat{color:var(--muted);background:var(--surface-2)}
.kpi .spark{display:block;margin-top:8px;width:100%;height:30px}
.info-i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);font-size:11px;color:var(--muted);cursor:help}

/* ---------- الرسوم ---------- */
.chart{position:relative;direction:ltr;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .axis text{font-size:11px;fill:var(--muted);font-family:inherit}
.chart .gridl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .xh{stroke:var(--text-secondary);stroke-width:1;stroke-dasharray:3 3}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .bar{transition:opacity .12s}
.chart .bar.dim{opacity:.45}
.chart .endlbl{font-size:12px;font-weight:700;fill:var(--text-primary)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--surface-1);color:var(--text-primary);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.14);font-size:12px;min-width:120px;opacity:0;transition:opacity .1s;direction:rtl}
.tip.on{opacity:1}
.tip .tt{color:var(--muted);margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:6px}
.tip .tr b{font-size:14px} .tip .tr .k{display:inline-block;width:12px;height:2px;border-radius:2px}
.empty-chart{display:grid;place-items:center;height:160px;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px}
.tbl-wrap{overflow:auto;max-height:420px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{position:sticky;top:0;background:var(--surface-1);text-align:right;font-weight:700;color:var(--text-secondary);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}
.hb{display:grid;gap:9px}
.hb-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;align-items:center;gap:10px;font-size:13.5px}
.hb-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary)}
.hb-track{display:block;height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;direction:rtl}
.hb-fill{display:block;height:100%;border-radius:4px;min-width:2px}
.hb-row .val{font-weight:700;direction:ltr;min-width:40px;text-align:left}
.hb-row .val small{color:var(--muted);font-weight:400;margin-left:4px}
.funnel .hb-row{grid-template-columns:minmax(110px,34%) 1fr 110px}
.heat td.c{text-align:center;font-weight:700;font-size:12.5px;min-width:52px;border:2px solid var(--surface-1);border-radius:6px}
.heat th{text-align:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--text-secondary)}
.chip.basic{background:#E0EDFC;color:#184f95} .chip.advanced{background:#FDE8DD;color:#9a3412} .chip.free{background:var(--surface-2);color:var(--text-secondary)}
.chip.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good-ink)} .chip.bad{background:color-mix(in srgb,var(--critical) 14%,transparent);color:var(--critical)} .chip.warn{background:#FEF3C7;color:#92400E}
.insights{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.insights li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.6}
.insights li .i{color:var(--brand);margin-top:2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{border:1.5px solid var(--line);background:var(--surface-1);border-radius:10px;padding:8px 11px;min-width:200px}
.code-out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--surface-2);border-radius:10px;padding:10px;word-break:break-all;direction:ltr;text-align:left;max-height:120px;overflow:auto;border:1px solid var(--line)}
.result{border:2px solid var(--good);background:color-mix(in srgb,var(--good) 6%,var(--surface-1))}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.phone{width:300px;max-width:100%;margin:0 auto;border-radius:34px;border:10px solid #0b0b0b;background:#F6F7F9;padding:14px 12px 20px;box-shadow:var(--shadow);direction:rtl;color:#0F172A}
.phone .ph-top{height:40px;background:#0F766E;border-radius:12px;margin-bottom:10px;color:#fff;display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:14px}
.phone .ph-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.phone .ph-acts div{height:58px;border-radius:14px;background:#E8F5EE}
.phone .ph-acts div+div{background:#E8F0FB}
.ad-card{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:16px;padding:12px 12px 12px 10px;text-align:right;box-shadow:0 6px 18px rgba(15,23,42,.12)}
.ad-card img{width:50px;height:50px;border-radius:10px;object-fit:cover;flex:none}
.ad-t{font-weight:800;font-size:15px}.ad-b{font-size:12.5px;opacity:.9}
.ad-cta{flex:none;font-weight:700;font-size:12px;border-radius:999px;padding:6px 10px}
.ad-tag{position:absolute;top:5px;left:9px;font-size:9px;opacity:.75;border:1px solid currentColor;border-radius:5px;padding:0 4px;line-height:14px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch input{width:20px;height:20px;accent-color:var(--brand)}
.colors{display:flex;gap:12px}.colors .fld{flex:1}.colors input[type=color]{height:44px;padding:4px}
.modal-bd{position:fixed;inset:0;background:rgba(11,11,11,.45);z-index:90;display:grid;place-items:center;padding:16px}
.modal{width:min(440px,100%);background:var(--surface-1);border-radius:20px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px}
.drawer{position:fixed;inset:0 auto 0 0;width:min(420px,100%);background:var(--surface-1);z-index:91;box-shadow:0 0 40px rgba(0,0,0,.25);padding:20px;overflow:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0b0b0b;color:#fff;padding:10px 18px;border-radius:12px;z-index:120;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.loading{opacity:.55;transition:opacity .2s}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--brand-l);border-radius:12px;padding:10px 12px;margin:4px 0 12px;cursor:pointer;line-height:1.5}
.chk input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:#0F766E}

</style>
</head>
